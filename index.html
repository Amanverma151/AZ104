LESSONS.redund={id:"redund",title:"Storage redundancy",mins:3,
 keywords:["redundancy","lrs","zrs","grs","gzrs","ra-grs","ra-gzrs","replication","paired region","secondary endpoint","failover","geo-redundant"],
 scenes:[
  {say:"Azure always keeps three copies of your data. Redundancy decides where those copies live. Start with locally redundant storage, LRS.",
   ops:[B("p","mg",30,40,"Central India","Primary region",560,330),B("d1","group",50,90,"Datacenter 1","",170,260),B("d2","group",230,90,"Datacenter 2","",170,260),B("d3","group",410,90,"Datacenter 3","",170,260),
        B("c1","storage",60,140,"copy 1","",150),B("c2","storage",60,210,"copy 2","",150),B("c3","storage",60,280,"copy 3","",150)]},
  {say:"LRS keeps all three copies in one datacenter. It's the cheapest, but if that datacenter goes down, your data is offline.",
   ops:[H("d1"),N("n1",30,400,"LRS: 3 copies, 1 datacenter · cheapest · no zone protection","accent")]},
  {say:"Zone-redundant storage, ZRS, spreads the three copies across three availability zones. A whole zone can fail and your data stays available.",
   ops:[...D("n1"),MV("c2",240,140),MV("c3",420,140),SET("d1","Zone 1"),SET("d2","Zone 2"),SET("d3","Zone 3"),N("n2",30,400,"ZRS: 3 copies across 3 zones · survives a zone outage","ok")]},
  {say:"Geo-redundant storage, GRS, keeps LRS in the primary region, then copies data asynchronously to the paired region, which keeps three more copies.",
   ops:[...D("n2"),MV("c2",60,210),MV("c3",60,280),SET("d1","Datacenter 1"),SET("d2","Datacenter 2"),SET("d3","Datacenter 3"),
        B("s","mg",620,40,"South India","Paired region",310,330),B("sd","group",640,90,"Datacenter","",270,260),B("s1","storage",700,140,"copy 4","",150),B("s2","storage",700,210,"copy 5","",150),B("s3","storage",700,280,"copy 6","",150),
        P(["c1","s1"],"async","signal"),N("n3",30,400,"GRS: LRS + 3 copies in the paired region · survives a regional outage","ok")]},
  {say:"Geo-zone-redundant storage, GZRS, combines both: zones in the primary region, plus a copy in the secondary. The most resilient option.",
   ops:[...D("n3"),MV("c2",240,140),MV("c3",420,140),SET("d1","Zone 1"),SET("d2","Zone 2"),SET("d3","Zone 3"),P(["c1","s1"],"async","signal"),N("n4",30,400,"GZRS: ZRS + paired region · zone and regional protection","ok")]},
  {say:"Add read access, RA-GRS or RA-GZRS, and apps can read from the secondary endpoint at any time, not only after a failover.",
   ops:[...D("n4"),N("n5",30,400,"Read access: https://stcontoso01-secondary.blob.core.windows.net","accent")]},
  {say:"Here's the summary to memorize.",
   ops:[C(),T("sum",60,60,[["Option","Copies","Survives"],["LRS","3 in one datacenter","Disk or rack failure"],["ZRS","3 across zones","Zone (datacenter) failure"],["GRS / RA-GRS","LRS + 3 in paired region","Regional outage"],["GZRS / RA-GZRS","ZRS + 3 in paired region","Zone and regional outage"]],"Redundancy options")]},
  {say:"Two traps. Premium accounts support only LRS and ZRS. And the Archive tier isn't available in zone-redundant accounts.",
   ops:[N("n6",60,300,"Premium: LRS or ZRS only\nArchive tier: LRS, GRS, RA-GRS only (not ZRS/GZRS)","bad")]}
 ],
 takeaways:["LRS: 3 copies in one datacenter. ZRS: 3 copies across zones.","GRS: LRS + async copy to the paired region. GZRS: ZRS + paired region.","RA- variants let you read from the secondary endpoint (-secondary) anytime.","After a customer-managed failover, the new primary is LRS until you reconfigure.","Premium accounts: LRS or ZRS only. Archive tier isn't supported with ZRS or GZRS."],
 traps:["\"Read data from the secondary region without failing over\" needs RA-GRS or RA-GZRS.","Geo-replication is asynchronous, so a regional failover can lose the most recent writes."],
 mnemonic:"L = Local building, Z = Zones, G = Geo pair, RA = Read Anytime.",
 lab:"Create a GRS account, check the secondary location on the Redundancy blade, then change it to RA-GRS and note the new secondary endpoint.",
 ref:"https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy"};

LESSONS.stenc={id:"stenc",title:"Storage encryption",mins:2,
 keywords:["storage encryption","sse","customer-managed key","cmk","key vault","managed hsm","infrastructure encryption","encryption scope","double encryption"],
 scenes:[
  {say:"All data in a storage account is encrypted at rest with 256-bit AES. It's always on, and you can't turn it off.",
   ops:[B("acct","storage",380,200,"stcontoso01","AES-256 at rest",200),N("n1",320,320,"Storage service encryption: always on","ok")]},
  {say:"By default, Microsoft manages the keys. For control over rotation and access, use customer-managed keys in Key Vault or Managed HSM.",
   ops:[B("kv","key",720,60,"Key Vault","customer-managed key",210),L("l1","kv","acct","CMK","ok")]},
  {say:"The Key Vault needs soft delete and purge protection turned on, and the storage account reaches the key through a managed identity.",
   ops:[...D("n1"),N("n2",320,320,"Key Vault: soft delete + purge protection\nAccess via the account's managed identity","accent")]},
  {say:"Infrastructure encryption adds a second layer with a different algorithm and key. You can only enable it when you create the account.",
   ops:[...D("n2"),N("n3",320,320,"Infrastructure (double) encryption:\nenable at account creation only","bad")]},
  {say:"Encryption scopes let different containers, or even single blobs, use different keys within one account. Useful for multi-tenant data.",
   ops:[...D("n3"),B("c1","app",40,60,"container: tenant-a","scope A",210),B("c2","app",40,340,"container: tenant-b","scope B",210),L("s1","c1","acct","key A","dash"),L("s2","c2","acct","key B","dash")]}
 ],
 takeaways:["Storage service encryption (AES-256) is always on and can't be disabled.","Customer-managed keys: Key Vault or Managed HSM with soft delete and purge protection, via managed identity.","Infrastructure encryption (double encryption) must be enabled at creation.","Encryption scopes apply different keys per container or blob."],
 traps:["Infrastructure encryption can't be added to an existing account.","Deleting or disabling the customer-managed key makes the data inaccessible."],
 mnemonic:"Always on, your key optional, double only at birth.",
 lab:"Create a Key Vault with purge protection, then switch a storage account's encryption to a customer-managed key using a system-assigned identity.",
 ref:"https://learn.microsoft.com/en-us/azure/storage/common/storage-service-encryption"};

LESSONS.objrep={id:"objrep",title:"Object replication",mins:2,
 keywords:["object replication","replication policy","replication rule","change feed","blob versioning","async copy","replicate container"],
 scenes:[
  {say:"Object replication copies block blobs asynchronously from a container in one account to a container in another account, in any region.",
   ops:[B("a","mg",40,60,"stsrc · Central India","source",380,300),B("b","mg",540,60,"stdst · West Europe","destination",380,300),B("ca","app",100,150,"container: images","",230),B("cb","app",600,150,"container: images-copy","",250),
        P(["ca","cb"],"async","signal")]},
  {say:"It needs blob versioning on both accounts, and change feed on the source account.",
   ops:[N("n1",40,390,"Requires: versioning (both) + change feed (source)","accent")]},
  {say:"Replicated blobs are read-only at the destination. Blobs in the Archive tier aren't replicated.",
   ops:[SET("cb","container: images-copy","read-only replicas"),...D("n1"),N("n2",40,390,"Destination: read-only · Archive-tier blobs skipped","bad")]},
  {say:"Use it to keep data close to users in another region, or to feed analytics without touching the source.",
   ops:[...D("n2"),N("n3",40,390,"Use cases: lower read latency elsewhere · analytics copies · cost tiers","ok")]},
  {say:"How it differs from geo-redundant storage.",
   ops:[C(),T("cmp",60,60,[["","GRS","Object replication"],["Destination","Fixed paired region","Any account, any region"],["Scope","Whole account","Selected containers (rules)"],["Readable copy","Only with RA-GRS","Yes"],["Needs","Nothing extra","Versioning + change feed"]],"GRS vs object replication")]}
 ],
 takeaways:["Object replication: async copy of block blobs between containers in different accounts.","Requires blob versioning on both accounts and change feed on the source.","Destination blobs are read-only; Archive-tier blobs aren't replicated.","Unlike GRS, you choose the destination account, region and containers."],

 mnemonic:"Pick your target, version both, feed the source.",
 lab:"Create two GPv2 accounts in different regions, enable versioning and change feed, and add a replication rule between two containers. Upload a blob and watch it appear.",

LESSONS.keys={id:"keys",title:"Access keys",mins:2,
 keywords:["access key","storage key","key rotation","regenerate key","key1","key2","shared key","connection string","key expiration"],
 scenes:[
  {say:"Each storage account has two access keys. A key gives full access to everything in the account, so treat it like a root password.",
   ops:[B("acct","storage",380,60,"stcontoso01","",200),B("k1","key",180,220,"key1","in use",170),B("k2","key",580,220,"key2","standby",170),L("l1","acct","k1"),L("l2","acct","k2")]},
  {say:"Two keys let you rotate without downtime. Point apps at key2, regenerate key1, and later switch back.",
   ops:[B("app","app",380,380,"app-orders","uses key1",200),L("la","app","k1","","ok"),SET("app","app-orders","uses key2"),L("la","app","k2","","ok"),SET("k1","key1","regenerated"),H("k1")]},
  {say:"Regenerating a key immediately breaks everything still using it, including any SAS tokens signed with it.",
   ops:[N("n1",20,465,"Regenerate key → old key + its SAS tokens stop working","bad")]},
  {say:"Store keys in Key Vault and set a key expiration policy as a reminder to rotate. Better still, use Entra ID and stop using keys.",
   ops:[...D("n1"),N("n2",20,465,"Keys in Key Vault · key expiration policy · prefer Entra ID","accent")]},
  {say:"You can disallow shared key authorization entirely. Then only Entra ID requests and user delegation SAS work.",
   ops:[...D("n2"),N("n3",20,460,"Allow storage account key access: Disabled\n→ Entra ID + user delegation SAS only","ok")]}
 ],
 takeaways:["Two keys enable zero-downtime rotation.","An account key grants full access to all data.","Regenerating a key invalidates it and every SAS signed with it.","Key expiration policies remind you to rotate.","Disabling shared key access forces Entra ID (and user delegation SAS)."],
 traps:["Account and service SAS tokens stop working when shared key access is disabled, because they're signed with keys.","Reader on the storage account can't list keys; listing keys needs a role with listKeys (like Contributor)."],
 mnemonic:"Two keys, one door: swap, regenerate, swap back.",
 lab:"Copy key1's connection string into an app setting, switch to key2, regenerate key1, and confirm the app keeps working.",
 ref:"https://learn.microsoft.com/en-us/azure/storage/common/storage-account-keys-manage"};

LESSONS.sas={id:"sas",title:"Shared access signatures",mins:3,
 keywords:["sas","shared access signature","sas token","account sas","service sas","user delegation sas","stored access policy","revoke sas","permissions","expiry"],
 scenes:[
  {say:"A shared access signature is a token added to a URL. It grants limited access: specific permissions, for a time window, optionally only from certain IP addresses.",
   ops:[T("tok",60,60,[["Parameter","Meaning","Example"],["sp","Permissions","rw (read, write)"],["st / se","Start / expiry time","2026-11-01 to 2026-11-08"],["sip","Allowed IP range","203.0.113.0-203.0.113.255"],["spr","Protocol","https"],["sig","Signature","signed with a key"]],"…/invoices/a.pdf?sv=…&sp=rw&se=…&sig=…")]},
  {say:"There are three kinds of SAS.",
   ops:[C(),T("ty",60,60,[["Type","Scope","Signed with"],["Account SAS","One or more services","Account key"],["Service SAS","One service (e.g. a container)","Account key"],["User delegation SAS","Blob Storage only","Entra ID credentials"]],"SAS types")]},
  {say:"A user delegation SAS is signed with Entra credentials instead of an account key. It's the most secure option, but it works only for Blob Storage.",
   ops:[R("ty",3,"ok"),N("n1",60,240,"Most secure: user delegation SAS (blobs only)","ok")]},
  {say:"To revoke a SAS tied to a stored access policy, edit or delete the policy. Otherwise you must regenerate the key that signed it.",
   ops:[...D("n1"),B("cn","app",60,280,"container: invoices","",220),B("pol","policy",380,280,"Stored access policy","partner-upload",240),L("lp","pol","cn","applies to","dash"),N("n2",60,400,"Revoke: delete/edit the stored access policy\nNo policy? Regenerate the signing key","accent")]},
  {say:"Stored access policies live on a container, file share, queue or table, up to five each. They let you change permissions or expiry after issuing a SAS.",
   ops:[...D("n2"),N("n3",60,400,"Stored access policies: max 5 per container/share/queue/table","accent")]},
  {say:"Exam tip: for a partner who uploads to one container for a week, use a service SAS with write and create only, HTTPS only, expiring in seven days.",
   ops:[...D("n3"),N("n4",60,400,"Least privilege: smallest scope · fewest permissions · shortest expiry","ok")]}
 ],
 takeaways:["SAS = delegated, limited access via URL token (permissions, start/expiry, IP, protocol).","Account SAS (multiple services), service SAS (one service), user delegation SAS (blobs, Entra-signed).","User delegation SAS is the most secure.","Revoke via stored access policy, or by regenerating the signing key.","Up to 5 stored access policies per container, share, queue or table."],
 traps:["A SAS without a stored access policy can only be revoked by regenerating the account key, which breaks everything using it.","A SAS is only as safe as its URL: anyone holding it has the access until expiry."],
 mnemonic:"SAS = Scope, Actions, Stopwatch.",
 lab:"Generate a service SAS for one blob with read-only permission and a 1-hour expiry. Open it in a browser, then try a URL with the signature changed.",
 ref:"https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview"};

LESSONS.stentra={id:"stentra",title:"Entra ID access to storage",mins:2,
 keywords:["storage blob data reader","storage blob data contributor","data roles","rbac storage","azure files identity","ad ds","entra kerberos","entra domain services","ntfs","smb share contributor"],
 scenes:[
  {say:"Entra ID is the recommended way to authorize data access. Assign data roles. Management roles like Contributor don't grant access to the data itself.",
   ops:[T("dr",60,60,[["Role","Grants"],["Storage Blob Data Reader","Read blobs"],["Storage Blob Data Contributor","Read, write, delete blobs"],["Storage Blob Data Owner","Above + set POSIX ACLs"],["Storage Queue Data Contributor","Read, write queue messages"],["Contributor (management)","Manage the account, not read data via Entra"]],"Data roles vs management roles")]},
  {say:"Example: an app's managed identity with Storage Blob Data Reader on a container reads blobs with no keys or secrets at all.",
   ops:[R("dr",1,"ok"),B("app","app",560,300,"app-report","managed identity",210),B("cn","app",560,420,"container: reports","",210),P(["app","cn"],"read","ok")]},
  {say:"Azure Files supports identity-based access over SMB, using on-premises AD DS, Microsoft Entra Domain Services, or Entra Kerberos for hybrid users.",
   ops:[C(),T("fi",60,60,[["Identity source","Typical use"],["On-premises AD DS","Domain-joined clients, synced identities"],["Entra Domain Services","Managed domain in Azure"],["Entra Kerberos","Hybrid users on Entra-joined devices"]],"Azure Files identity-based access")]},
  {say:"There are two layers. Share-level access uses RBAC roles like Storage File Data SMB Share Contributor. Folder and file permissions use Windows NTFS ACLs.",
   ops:[T("lv",60,250,[["Layer","Controlled by"],["Share level","RBAC: SMB Share Reader / Contributor / Elevated Contributor"],["Directory and file level","Windows ACLs (NTFS)"]],"Two permission layers")]},
  {say:"Both layers must allow the action. Elevated Contributor can also change NTFS permissions.",
   ops:[N("n1",60,400,"Effective access = share RBAC ∩ NTFS ACLs","accent")]}
 ],
 takeaways:["Use data roles (Storage Blob/Queue/File Data …) for Entra-based data access.","Management roles (Owner, Contributor) don't include data actions.","Managed identities + data roles remove keys from apps.","Azure Files identity sources: AD DS, Entra Domain Services, Entra Kerberos.","Files permissions: share-level RBAC + NTFS ACLs; both must allow."],
 traps:["An Owner of the subscription may still get \"no permission to list data\" when the portal uses Entra auth. Add a data role.","Storage File Data SMB Share Elevated Contributor is needed to change NTFS permissions."],
 mnemonic:"Manage the box with Contributor, open the box with Data roles.",
 lab:"Assign yourself Storage Blob Data Reader on one container, switch the portal's authentication method to Entra ID, and browse it. Then try another container.",
 ref:"https://learn.microsoft.com/en-us/azure/storage/blobs/authorize-access-azure-active-directory"};

LESSONS.stfw={id:"stfw",title:"Storage firewalls & networking",mins:2,

  {say:"Exceptions let trusted Azure services, like Azure Backup or Event Grid, reach the account even when it's locked down.",
   ops:[...D("n1"),N("n2",500,330,"Exception: Allow Azure services on the\ntrusted services list","accent")]},
  {say:"Or disable public network access completely and use private endpoints, one for each service you need, like blob and file.",

  {say:"Remember the three public network access settings.",

 ],

LESSONS.tiers={id:"tiers",title:"Blob containers & access tiers",mins:3,
 keywords:["blob","container","block blob","append blob","page blob","access tier","hot","cool","cold","archive","rehydrate","rehydration","early deletion","anonymous access"],
 scenes:[
  {say:"Blobs live in containers. Block blobs hold files and media, append blobs suit logs, and page blobs back virtual disks.",
   ops:[B("acct","storage",380,40,"stcontoso01","",200),B("ct","group",60,150,"container: media","",840,140),B("b1","app",90,200,"photo.jpg","block blob",200),B("b2","app",380,200,"app.log","append blob",200),B("b3","storage",670,200,"disk.vhd","page blob",200)]},
  {say:"Anonymous public access is disabled by default on new accounts, so containers stay private unless you deliberately allow it.",
   ops:[N("n1",60,320,"Container access: Private (default) · Blob · Container\nRequires \"Allow blob anonymous access\" on the account","accent")]},
  {say:"Access tiers balance storage cost against access cost. The cooler the tier, the cheaper to store, and the more expensive to read.",
   ops:[C(),T("tr",60,60,[["Tier","For","Min. days","Availability"],["Hot","Frequent access","None","Online"],["Cool","Infrequent access","30","Online"],["Cold","Rare access","90","Online"],["Archive","Long-term retention","180","Offline"]],"Access tiers")]},
  {say:"Move a blob out of Cool, Cold or Archive before its minimum days, and you pay an early deletion charge for the remaining days.",
   ops:[R("tr",2,"accent"),N("n2",60,260,"Early deletion fee: Cool 30 · Cold 90 · Archive 180 days","bad")]},
  {say:"Archive blobs are offline. To read one, rehydrate it to an online tier. Standard priority takes up to fifteen hours, high priority usually under one hour.",
   ops:[...D("n2"),R("tr",4,"accent"),B("ar","storage",60,300,"scan-2019.pdf","Archive · offline",200),B("ho","storage",500,300,"scan-2019.pdf","Hot · online",200),P(["ar","ho"],"rehydrate","signal")]},
  {say:"Rehydrate by changing the blob's tier, or by copying it to a new blob in an online tier.",
   ops:[N("n3",60,420,"Rehydrate: Set tier → Hot/Cool/Cold, or Copy Blob to an online tier\nStandard: up to 15 h · High priority: usually < 1 h","ok")]}
 ],
 takeaways:["Blob types: block (files), append (logs), page (disks).","Anonymous access is off by default; container levels: Private, Blob, Container.","Tiers: Hot, Cool (30 days), Cold (90), Archive (180, offline).","Archive needs rehydration: standard up to 15 h, high priority usually under 1 h.","Early deletion fees apply when leaving a tier before its minimum."],
 traps:["Archive blobs can't be read directly. Plan hours for rehydration.","Archive isn't available in ZRS, GZRS or RA-GZRS accounts."],
 mnemonic:"Hot now, Cool 30, Cold 90, Archive 180 and asleep.",
 lab:"Upload a blob, move it to Archive, try to download it, then rehydrate it to Hot with standard priority and note the archive status.",
 ref:"https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview"};

LESSONS.lifecycle={id:"lifecycle",title:"Lifecycle management",mins:2,
 keywords:["lifecycle management","lifecycle policy","tiering rule","move to archive","delete old blobs","last access time","prefix filter","blob index tags"],
 scenes:[
  {say:"Lifecycle management rules move or delete blobs automatically, based on how old they are or when they were last accessed.",
   ops:[B("h","storage",40,180,"Hot","day 0",170),B("c","storage",280,180,"Cool","after 30 days",170),B("a","storage",520,180,"Archive","after 90 days",170),B("d","cube",760,180,"Delete","after 365 days",170),
        L("l1","h","c"),L("l2","c","a"),L("l3","a","d"),P(["h","c","a","d"],"logs/app.log","signal")]},
  {say:"A rule has filters and actions.",
   ops:[T("ru",60,300,[["Rule: archive-logs",""],["Filter","blobTypes: blockBlob · prefixMatch: logs/"],["tierToCool","daysAfterModificationGreaterThan: 30"],["tierToArchive","daysAfterModificationGreaterThan: 90"],["delete","daysAfterModificationGreaterThan: 365"]])]},
  {say:"Filters narrow a rule by blob prefix, like logs slash, or by blob index tags.",
   ops:[R("ru",1,"accent")]},
  {say:"To tier by last access instead of modification, turn on access time tracking first.",
   ops:[R("ru",0),N("n1",600,300,"daysAfterLastAccessTimeGreaterThan\nneeds access time tracking","accent")]},
  {say:"Rules run about once a day, so a new or changed policy can take up to 24 hours or more to act.",

LESSONS.stprotect={id:"stprotect",title:"Blob data protection",mins:3,
 keywords:["soft delete","container soft delete","versioning","blob versioning","snapshot","point-in-time restore","immutability","legal hold","worm","change feed","retention"],
 scenes:[
  {say:"Blob Storage has several layers of protection. Each one handles a different kind of mistake.",
   ops:[T("pr",60,60,[["Feature","Protects against"],["Blob soft delete","Deleted blobs (1–365 days)"],["Container soft delete","Deleted containers"],["Versioning","Overwrites and deletes"],["Point-in-time restore","Bulk mistakes in block blobs"],["Snapshots","Manual read-only copies"],["Immutability (WORM)","Any change, even by admins"]],"Data protection")]},
  {say:"Blob soft delete keeps deleted blobs for a retention period you set, from one to three hundred sixty-five days. Container soft delete does the same for whole containers.",
   ops:[R("pr",1,"accent"),B("b","storage",560,300,"report.xlsx","soft-deleted · 14 days left",250),N("n1",560,400,"Undelete within retention ✓","ok")]},
  {say:"Versioning automatically keeps the previous version every time a blob is overwritten or deleted. Restore any version by promoting it.",
   ops:[R("pr",3,"accent"),...D("b","n1"),B("v1","app",560,280,"report.xlsx","version · 09:00",180),B("v2","app",560,360,"report.xlsx","version · 11:30",180),B("cur","app",760,440,"current","12:15",170)]},
  {say:"Point-in-time restore rolls block blobs in containers back to an earlier time. It needs versioning, change feed and soft delete turned on.",
   ops:[R("pr",4,"accent"),...D("v1","v2","cur"),N("n2",560,320,"Point-in-time restore requires:\nversioning + change feed + soft delete","accent")]},
  {say:"For compliance, immutability policies make blobs write once, read many. Time-based retention or legal hold blocks changes and deletes, even by admins.",
   ops:[R("pr",6,"bad"),...D("n2"),N("n3",560,320,"Immutability: time-based retention\nor legal hold · WORM","bad")]},
  {say:"Exam tip: soft delete protects from deletes. Versioning protects from overwrites. Immutability stops everyone.",
   ops:[...D("n3"),N("n4",560,320,"Delete → soft delete\nOverwrite → versioning\nCompliance → immutability","ok")]}
 ],
 takeaways:["Blob soft delete and container soft delete: 1–365 days retention.","Versioning keeps previous versions on overwrite or delete.","Point-in-time restore (block blobs) needs versioning, change feed and soft delete.","Snapshots are manual, read-only copies.","Immutability policies (time-based retention, legal hold) enforce WORM."],
 traps:["Soft delete doesn't protect against overwrites; versioning does.","A locked time-based retention policy can't be shortened or deleted."],
 mnemonic:"Bin (soft delete), History (versions), Time machine (PITR), Vault (immutability).",
 lab:"Turn on versioning and blob soft delete, overwrite a file twice, delete it, then undelete it and promote an older version.",

Object.assign(CASES,{litware:{title:"Litware Health",text:"Litware Health stores patient documents in Azure in Central India.\n\n• Scanned documents must stay readable if an entire availability zone fails, and must be recoverable if the whole region fails.\n• Doctors' reports must be retained unchanged for 7 years; nobody, including administrators, may delete or modify them.\n• An external billing partner needs to upload files to one container for 14 days. Litware must be able to revoke that access early without affecting other apps.\n• Logs older than 90 days should move to the cheapest storage and be deleted after 2 years.\n• Branch offices use on-premises Windows file servers and want the same files cached locally with a single copy in Azure.\n• The storage account must not be reachable from the internet."}});

LESSONS.metrics={id:"metrics",title:"Metrics vs logs",mins:2,
 keywords:["azure monitor","metrics","logs","metrics explorer","activity log","platform metrics","retention","93 days","aggregation","log analytics"],
 scenes:[
  {say:"Azure Monitor collects two kinds of data: metrics and logs. Almost every monitoring question starts with knowing which one you need.",
   ops:[B("res","cube",60,220,"vm-web1","Azure resource"),B("am","watcher",380,220,"Azure Monitor","",200),B("me","app",720,110,"Metrics","numbers over time",200),B("lg","app",720,330,"Logs","records you query",200),
        L("l1","res","am"),L("l2","am","me"),L("l3","am","lg"),P(["res","am","me"],"CPU 72%","signal"),P(["res","am","lg"],"event","signal")]},
  {say:"Metrics are lightweight numbers sampled every minute, like CPU percentage. Platform metrics are collected automatically and kept for 93 days.",
   ops:[C(),T("cmp",60,60,[["","Metrics","Logs"],["Data","Numeric time series","Records with many fields"],["Collected","Automatically (platform)","After you configure it"],["Retention","93 days","Workspace setting (30 days default)"],["Explore with","Metrics Explorer","Log Analytics (KQL)"],["Best for","Near real-time alerts, charts","Investigation, correlation"]],"Metrics vs logs"),R("cmp",3,"accent")]},
  {say:"Metrics Explorer charts them. Pick a resource, a metric and an aggregation like average or maximum, then split by a dimension or pin the chart to a dashboard.",
   ops:[R("cmp",4,"accent"),N("n1",60,300,"Aggregations: Avg · Min · Max · Sum · Count\nSplit by dimension · pin to dashboard","accent")]},
  {say:"Logs hold detailed records. They live in a Log Analytics workspace, and you query them with Kusto Query Language.",
   ops:[R("cmp",5,"accent"),...D("n1"),N("n2",60,300,"Logs → Log Analytics workspace → KQL","accent")]},
  {say:"The activity log is special. It records control-plane events, like who created or deleted a resource, for every subscription. It's kept for 90 days.",
   ops:[...D("n2"),T("al",60,300,[["Activity log (subscription)",""],["Operation","Delete Virtual Machine"],["Caller","priya@contoso.com"],["Status","Succeeded"],["Kept","90 days (export for longer)"]])]},
  {say:"Exam pattern: who deleted the VM, activity log. How busy is the CPU, metrics. Why did the app throw errors, logs.",
   ops:[N("n3",520,320,"Who did it? → Activity log\nHow much / how fast? → Metrics\nWhat exactly happened? → Logs","ok")]}
 ],
 takeaways:["Metrics: numeric, 1-minute samples, collected automatically, 93 days retention.","Logs: detailed records in a Log Analytics workspace, queried with KQL.","Metrics Explorer: aggregation, splitting by dimension, pinning to dashboards.","Activity log: subscription control-plane events (who/what/when), kept 90 days."],
 traps:["Resource logs (like storage read requests) aren't collected until you add a diagnostic setting.","Guest OS counters (like memory inside the VM) need an agent; they aren't platform metrics."],
 mnemonic:"Metrics measure, logs explain, the activity log names names.",
 lab:"Open Metrics Explorer on a VM, chart Percentage CPU with Max aggregation over 24 hours, then open the subscription's activity log and filter to Delete operations.",
 ref:"https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/overview"};

LESSONS.diag={id:"diag",title:"Diagnostic settings & workspaces",mins:2,
 keywords:["diagnostic settings","resource logs","log analytics workspace","event hub","archive to storage","activity log export","retention","workspace"],
 scenes:[
  {say:"Resource logs, like Key Vault access or storage reads, aren't collected by default. You turn them on with a diagnostic setting on each resource.",
   ops:[B("kv","key",60,220,"kv-prod","Key Vault"),B("ds","policy",380,220,"Diagnostic setting","AuditEvent logs",220)]},
  {say:"A diagnostic setting sends data to up to three kinds of destination: a Log Analytics workspace, a storage account, or an event hub.",
   ops:[B("law","app",720,70,"Log Analytics","query + alert",200),B("st","storage",720,220,"Storage account","cheap archive",200),B("eh","app",720,370,"Event hub","stream to SIEM",200),
        L("a","kv","ds"),L("b","ds","law","","ok"),L("c","ds","st","","ok"),L("d","ds","eh","","ok"),P(["kv","ds","law"],"","signal"),P(["kv","ds","st"],"","signal"),P(["kv","ds","eh"],"","signal")]},
  {say:"Pick by purpose: query and alert in Log Analytics, keep cheaply for years in storage, or stream to an external tool through an event hub.",
   ops:[N("n1",60,330,"Analyze → workspace\nArchive → storage\nStream → event hub","ok")]},
  {say:"The activity log uses a diagnostic setting too, at the subscription level, to keep events longer than 90 days or to query them with KQL.",
   ops:[...D("n1"),N("n2",60,330,"Subscription → Activity log →\nDiagnostic settings → workspace","accent")]},
  {say:"Log Analytics workspaces set retention, 30 days by default, extendable for years. One workspace can collect from many resources and subscriptions.",
   ops:[...D("n2"),N("n3",60,330,"Workspace retention: 30 days default\nOne workspace, many resources","accent")]}
 ],
 takeaways:["Resource logs need a diagnostic setting per resource.","Destinations: Log Analytics workspace, storage account, event hub (and partner solutions).","Activity log export also uses a subscription-level diagnostic setting.","Workspaces default to 30 days of retention; longer is configurable."],
 traps:["\"Query Key Vault access events with KQL\" means a diagnostic setting to a Log Analytics workspace, not to storage.","Streaming logs to a third-party SIEM uses an event hub."],
 mnemonic:"Query, Keep, or Stream: workspace, storage, event hub.",
 lab:"Add a diagnostic setting on a Key Vault sending AuditEvent to a Log Analytics workspace, read a secret, and find the event with AzureDiagnostics in Logs.",
 ref:"https://learn.microsoft.com/en-us/azure/azure-monitor/platform/diagnostic-settings"};

LESSONS.kql={id:"kql",title:"KQL basics",mins:3,
 keywords:["kql","kusto","query","where","summarize","project","render","ago","bin","count","heartbeat","perf","log query"],
 scenes:[
  {say:"KQL queries start with a table, then pipe the rows through operators, one per line, like a production line.",
   ops:[T("q1",60,60,[["Perf"],["| where TimeGenerated > ago(1h)"],["| where CounterName == \"% Processor Time\""],["| summarize avg(CounterValue) by Computer"],["| order by avg_CounterValue desc"]],"Query")]},
  {say:"Where filters rows. Ago gives a relative time, so ago one hour means the last hour.",
   ops:[R("q1",1,"accent")]},
  {say:"Summarize groups and aggregates, like count, average or max, by one or more columns.",
   ops:[R("q1",3,"accent"),T("res",560,60,[["Computer","avg_CounterValue"],["vm-web1","71.4"],["vm-web2","38.2"],["vm-db1","12.9"]],"Result")]},
  {say:"Here are the operators you'll see most.",
   ops:[C(),T("op",60,60,[["Operator","Does"],["where","Filter rows"],["project","Choose or rename columns"],["summarize … by","Aggregate by group"],["bin(TimeGenerated, 5m)","Bucket time"],["order by / top 10 by","Sort or take the top rows"],["render timechart","Draw a chart"]],"Common operators")]},
  {say:"Classic exam query: find machines that stopped sending heartbeats in the last fifteen minutes.",
   ops:[T("q2",440,60,[["Heartbeat"],["| summarize LastSeen = max(TimeGenerated) by Computer"],["| where LastSeen < ago(15m)"]],"Offline machines")]},
  {say:"Know the common tables: Heartbeat, Perf, Event for Windows, Syslog for Linux, and AzureActivity for the activity log.",
   ops:[T("tb",440,230,[["Table","Contains"],["Heartbeat","Agent check-ins"],["Perf","Performance counters"],["Event","Windows event logs"],["Syslog","Linux logs"],["AzureActivity","Activity log"]],"Common tables")]}
 ],
 takeaways:["Queries flow: Table | operator | operator.","where filters; project picks columns; summarize aggregates by groups.","ago(1h), bin(TimeGenerated, 5m), render timechart.","Tables: Heartbeat, Perf, Event, Syslog, AzureActivity, AzureDiagnostics."],
 traps:["summarize count() by Computer returns one row per computer, not the raw events.","String comparison with == is case-sensitive; =~ is case-insensitive."],
 mnemonic:"Where filters, Summarize squashes, Project picks, Render paints.",
 lab:"In a workspace with a VM connected, run Heartbeat | summarize count() by bin(TimeGenerated, 5m) | render timechart, then change it to show only the last 30 minutes.",
 ref:"https://learn.microsoft.com/en-us/kusto/query/tutorials/learn-common-operators"};

LESSONS.alerts={id:"alerts",title:"Alerts & action groups",mins:3,
 keywords:["alert","alert rule","action group","alert processing rule","severity","metric alert","log alert","activity log alert","webhook","logic app","runbook","maintenance window","suppress alerts"],
 scenes:[
  {say:"An alert rule watches a signal and fires when a condition is met. It has a scope, a condition, actions, and details like severity.",
   ops:[B("vm","vm",60,220,"vm-web1"),B("ar","policy",360,220,"Alert rule","CPU > 85% for 5 min",230),B("ag","users",700,220,"Action group","ag-ops",200),L("a","vm","ar","signal","dash"),L("b","ar","ag","fires","ok")]},
  {say:"Signals can be metrics, log search results, activity log events, or resource and service health.",
   ops:[T("sg",60,330,[["Signal","Example"],["Metric","CPU > 85% for 5 minutes"],["Log search","More than 10 errors in AppTraces in 15 min"],["Activity log","Someone deletes a VM"],["Service/Resource health","Azure outage affecting you"]],"Signal types")]},
  {say:"An action group is a reusable list of who to notify and what to run: email, SMS, push or voice, plus webhooks, Logic Apps, Functions or Automation runbooks.",
   ops:[...D("sg"),T("ac",560,320,[["Action group: ag-ops",""],["Notify","Email, SMS, push, voice"],["Run","Webhook, Logic App, Function, runbook, ITSM"]]),P(["ar","ag"],"Sev 1","bad")]},
  {say:"Severity runs from zero, critical, to four, verbose. Metric alerts are stateful, so they resolve on their own when the condition clears.",
   ops:[N("n1",60,330,"Severity: Sev0 Critical … Sev4 Verbose\nMetric alerts resolve automatically","accent")]},
  {say:"Planned maintenance tonight? An alert processing rule can suppress notifications for a time window, across many alert rules at once.",
   ops:[...D("n1"),B("pr","lock",360,60,"Alert processing rule","Sat 22:00–02:00 · suppress",260),L("c","pr","ar","applies to","dash"),P(["ar","ag"],"","bad",true)]},
  {say:"Processing rules can also add an action group to every alert in a scope, so you don't edit dozens of rules one by one.",
   ops:[N("n2",60,330,"Alert processing rules: suppress in a window\nor add action groups at scale","ok")]}
 ],
 takeaways:["Alert rule = scope + condition (signal) + action groups + severity.","Signals: metric, log search, activity log, resource/service health.","Action groups are reusable: notifications plus automation (webhook, Logic App, Function, runbook, ITSM).","Severity Sev0 (critical) to Sev4 (verbose).","Alert processing rules suppress notifications during maintenance or add action groups at scale."],
 traps:["To silence alerts during a maintenance window, don't disable rules. Use an alert processing rule.","\"Notify when someone deletes a resource group\" is an activity log alert, not a metric alert."],
 mnemonic:"Rule watches, Group acts, Processing rule hushes.",
 lab:"Create an action group that emails you, then a metric alert on a VM for CPU > 80% using it. Add an alert processing rule that suppresses it for the next hour.",
 ref:"https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-overview"};

  {say:"To see inside a VM, like memory or disk use by the guest OS, install the Azure Monitor agent. It replaced the legacy Log Analytics agent.",
   ops:[C(),B("vm","vm",60,220,"vm-web1","Azure Monitor agent",220),B("dcr","policy",420,220,"Data collection rule","what + where",220),B("law","app",760,220,"Workspace","",170),
        L("a","vm","dcr","","dash"),L("b","dcr","law","","ok"),P(["vm","dcr","law"],"Perf, Event","signal")]},
  {say:"A data collection rule tells the agent what to collect, like counters and event logs, and where to send it. One rule can apply to many machines.",

LESSONS.vaults={id:"vaults",title:"Recovery Services & Backup vaults",mins:2,
 keywords:["recovery services vault","backup vault","azure backup","vault redundancy","cross region restore","soft delete backup","immutable vault","mars agent","workloads"],
 scenes:[
  {say:"Azure Backup stores recovery points in a vault. There are two vault types, and each protects different workloads.",
   ops:[B("rsv","vnet",40,60,"Recovery Services vault","",420,420),B("bv","vnet",500,60,"Backup vault","",420,420),
        B("a1","vm",80,120,"Azure VMs","",200),B("a2","sql",80,200,"SQL / SAP HANA in VMs","",240),B("a3","storage",80,280,"Azure Files","",200),B("a4","onprem",80,360,"On-premises (MARS)","",230),
        B("b1","storage",540,120,"Azure Disks","",200),B("b2","storage",540,200,"Azure Blobs","",200),B("b3","sql",540,280,"Azure Database for PostgreSQL","",300),B("b4","cube",540,360,"AKS","",200)]},
  {say:"For VM backups, the vault must be in the same region as the VMs it protects.",
   ops:[N("n1",500,440,"Vault region = VM region (for VM backup)","bad")]},
  {say:"Set the vault's storage redundancy, LRS, ZRS or GRS, before you protect the first item. With GRS you can enable Cross Region Restore.",
   ops:[C(),B("v","vnet",40,60,"rsv-prod","Central India · GRS",420,300),B("rp","storage",100,160,"Recovery points","",200),B("sec","mg",560,60,"South India","paired region",360,300),B("rp2","storage",640,160,"Copy","Cross Region Restore",200),
        P(["rp","rp2"],"geo","signal"),N("n2",40,400,"Redundancy: set before first backup · GRS + Cross Region Restore","accent")]},
  {say:"Soft delete keeps deleted backup data for fourteen days by default, so an attacker or a mistake can't wipe your backups instantly.",
   ops:[...D("n2"),N("n3",40,400,"Soft delete: 14 days by default · immutable vaults block changes","ok")]},
  {say:"For on-premises Windows files and folders, install the MARS agent and back up straight to a Recovery Services vault.",
   ops:[...D("n3"),N("n4",40,400,"On-premises files/folders → MARS agent → Recovery Services vault","accent")]}
 ],
 takeaways:["Recovery Services vault: Azure VMs, SQL/SAP HANA in VMs, Azure Files, on-premises (MARS/MABS).","Backup vault: Azure Disks, Blobs, PostgreSQL, AKS.","VM backup needs a vault in the same region as the VM.","Set vault redundancy before the first backup; GRS enables Cross Region Restore.","Soft delete keeps deleted backup data 14 days by default."],
 traps:["You can't change vault redundancy after items are protected.","Backing up a VM in West Europe to a vault in Central India isn't allowed."],
 mnemonic:"Recovery Services = Classic workloads. Backup vault = newer data services.",
 lab:"Create a Recovery Services vault in the same region as a test VM, set redundancy to LRS, and enable backup with the default policy. Trigger Backup now.",
 ref:"https://learn.microsoft.com/en-us/azure/backup/backup-azure-recovery-services-vault-overview"};

LESSONS.bpolicy={id:"bpolicy",title:"VM backup policies",mins:2,
 keywords:["backup policy","standard policy","enhanced policy","instant restore","snapshot retention","retention","daily","weekly","monthly","yearly","app-consistent","crash-consistent"],
 scenes:[
  {say:"A backup policy sets when backups run and how long recovery points are kept.",
   ops:[T("pol",60,60,[["Policy: daily-prod",""],["Schedule","Daily at 23:00 IST"],["Instant restore snapshots","2 days"],["Daily points","Keep 30 days"],["Weekly (Sunday)","Keep 12 weeks"],["Monthly (1st)","Keep 12 months"],["Yearly (Jan 1)","Keep 7 years"]],"Backup policy")]},
  {say:"Each backup first takes a snapshot on the VM's disks for instant restore, then transfers the data to the vault.",
   ops:[B("vm","vm",560,90,"vm-db1"),B("sn","storage",560,200,"Snapshot","instant restore tier",210),B("vt","vnet",540,320,"Vault","",260,150),B("rp","storage",580,380,"Recovery point","vault tier",190),
        P(["vm","sn"],"1","signal"),P(["sn","rp"],"2","signal")]},
  {say:"Standard policies back up once a day. Enhanced policies allow several backups a day and are required for Trusted Launch VMs.",
   ops:[C(),T("cmp",60,60,[["","Standard","Enhanced"],["Frequency","Once a day","Up to every 4 hours"],["Snapshot retention","1–5 days","1–30 days"],["Trusted Launch VMs","Not supported","Supported"]],"Policy types")]},
  {say:"Backups are app-consistent when the VM is running: VSS on Windows, scripts on Linux. A stopped VM gets crash-consistent backups.",
   ops:[N("n1",60,260,"Running: app-consistent (VSS / pre-post scripts)\nStopped: crash-consistent","accent")]},
  {say:"Exam pattern: more than one backup a day, or a Trusted Launch VM, means an enhanced policy.",
   ops:[N("n2",60,340,"Multiple backups/day or Trusted Launch → Enhanced","ok")]}
 ],
 takeaways:["Policy = schedule + retention (daily, weekly, monthly, yearly).","Backups snapshot first (instant restore), then transfer to the vault.","Standard: once a day, 1–5 days snapshots. Enhanced: up to every 4 hours, 1–30 days, Trusted Launch.","Running VMs get app-consistent backups; stopped VMs get crash-consistent ones."],
 traps:["A standard policy can't take more than one backup per day.","Changing a VM's policy applies the new retention to future points; existing points follow their policy rules."],
 mnemonic:"Snapshot first, vault second; Enhanced for many a day.",
 lab:"Create an enhanced policy with backups every 4 hours and assign it to a test VM. Check Backup jobs after the first run.",
 ref:"https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-introduction"};

LESSONS.restore={id:"restore",title:"Restoring VMs and files",mins:2,
 keywords:["restore","restore vm","restore disks","replace existing","file recovery","item level restore","cross region restore","alternate location","recovery point"],
 scenes:[
  {say:"When something breaks, pick a recovery point and a restore type.",
   ops:[T("rt",60,60,[["Restore type","Result"],["Create new virtual machine","A new VM from the recovery point"],["Restore disks","Disks + template; you build the VM"],["Replace existing","Swap the existing VM's disks"],["File recovery","Mount the point, copy individual files"],["Cross Region Restore","Restore in the paired region (GRS)"]],"Restore options")]},
  {say:"Restore disks is the flexible choice. You get the disks and a template, so you can change the size, network or settings before creating the VM.",
   ops:[R("rt",2,"accent")]},
  {say:"Need one deleted file? Use file recovery. A script mounts the recovery point as a drive, you copy the file, then unmount.",
   ops:[R("rt",4,"ok"),B("rp","storage",560,300,"Recovery point","Tue 23:00",190),B("pc","vm",560,420,"Admin PC","mounted as F:",190),P(["rp","pc"],"iSCSI mount","signal")]},
  {say:"Run the file recovery script on a machine with a compatible operating system, and unmount when you're done.",
   ops:[N("n1",60,300,"File recovery script: compatible OS\nunmount when finished","accent")]},
  {say:"If the whole region is down and the vault is GRS with Cross Region Restore enabled, restore in the secondary region.",

LESSONS.asr={id:"asr",title:"Azure Site Recovery",mins:3,
 keywords:["site recovery","asr","disaster recovery","replication","failover","test failover","failback","reprotect","recovery plan","rpo","rto","commit"],
 scenes:[
  {say:"Azure Site Recovery keeps a running copy of your VMs in another region, so the whole app can fail over if the primary region goes down.",
   ops:[B("p","mg",30,60,"Central India","primary",420,330),B("s","mg",510,60,"South India","recovery region",420,330),B("v1","vm",90,140,"vm-web1"),B("v2","sql",90,240,"vm-db1"),
        B("r1","vm",570,140,"vm-web1","replica"),B("r2","sql",570,240,"vm-db1","replica"),B("rsv","vnet",760,180,"Vault","",150,120),P(["v1","r1"],"replicate","signal"),P(["v2","r2"],"replicate","signal")]},
  {say:"The Recovery Services vault lives in the target region, not the source region. Replication is continuous.",
   ops:[N("n1",30,410,"Vault: in the TARGET region · continuous replication","accent")]},
  {say:"A recovery plan groups VMs and sets the order: database first, then web servers, with scripts or runbooks in between.",
   ops:[...D("n1"),T("plan",30,410,[["Recovery plan: shop-dr",""],["Group 1","vm-db1  →  runbook: update DNS"],["Group 2","vm-web1, vm-web2"]])]},
  {say:"Test failover brings up replicas in an isolated network. Production keeps running, and nothing is affected. Do it regularly.",
   ops:[...D("plan"),N("n2",30,410,"Test failover: isolated VNet, zero production impact","ok")]},
  {say:"In a real disaster, fail over, then commit. When the primary region is back, reprotect, and fail back.",
   ops:[...D("n2"),T("st",30,410,[["Failover","Commit","Reprotect","Failback"]])]},
  {say:"Backup or Site Recovery? Backup restores data to a point in time. Site Recovery keeps the app running somewhere else.",
   ops:[C(),T("cmp",80,100,[["","Azure Backup","Azure Site Recovery"],["Goal","Recover data","Keep the app running elsewhere"],["Typical RPO","Hours (daily backups)","Seconds to minutes"],["Restores","Points in time, files","Whole VMs in another region"],["Use for","Deletion, corruption, ransomware","Regional outage"]],"Backup vs Site Recovery")]}
 ],
 takeaways:["Site Recovery replicates VMs continuously to another region (or on-premises to Azure).","The vault for Azure-to-Azure replication is in the target region.","Recovery plans order failover groups and run scripts or runbooks.","Test failover uses an isolated network with no production impact.","Sequence: failover → commit → reprotect → failback."],
 traps:["Creating the vault in the same region as the source VMs fails for Azure-to-Azure replication.","Site Recovery isn't a backup. Corrupted data replicates too; use Azure Backup for point-in-time recovery."],
 mnemonic:"Test it, Fail it, Commit it, Reprotect it, Bring it back.",
 lab:"Enable replication for a small VM to another region, wait for it to be protected, then run a test failover into an isolated VNet and clean it up.",
 ref:"https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-tutorial-enable-replication"};

/* ----- Player: runs a lesson on a Stage ----- */
class Player{
 constructor(stage,lesson,ui){this.stage=stage;this.lesson=lesson;this.ui=ui;this.i=0;this.playing=false;this.token=null;this.rate=1;}
 estimate(s){const w=String(s.say||"").split(/\s+/).length;return Math.max(4,w/3+1.5)/this.rate;}
 buildTo(i){this.stage.reset();for(let k=0;k<i;k++)for(const op of (this.lesson.scenes[k].ops||[]))this.stage.apply(op,false);}
 kill(){if(this.token)this.token.dead=true;}
 async go(i,autoplay){
  this.kill();const sc=this.lesson.scenes;if(i<0)i=0;if(i>=sc.length){this.playing=false;this.ui.onEnd();return;}
  this.i=i;this.buildTo(i);const token={dead:false};this.token=token;this.stage.rate=this.rate;
  const s=sc[i];this.ui.onScene(i,s,this.estimate(s),autoplay);
  if(!autoplay){for(const op of (s.ops||[]))if(op.op!=="packet")this.stage.apply(op,true);this.playing=false;return;}
  this.playing=true;
  const ops=(async()=>{for(const op of (s.ops||[])){if(token.dead)return;const r=this.stage.apply(op,true,token);
     if(r&&r.then)await r;else await sleep(op.op==="del"||op.op==="hlrow"||op.op==="set"||op.op==="mark"?120:380);}})();
  const t0=performance.now();
  await ops;if(token.dead)return;
  const left=this.estimate(s)*1000-(performance.now()-t0);if(left>0)await sleep(left);if(token.dead)return;await sleep(650/this.rate);if(token.dead)return;
  this.go(i+1,true);

 play(){this.go(this.i>=this.lesson.scenes.length?0:this.i,true);}
 pause(){this.kill();this.playing=false;this.buildTo(this.i);for(const op of (this.lesson.scenes[this.i].ops||[]))if(op.op!=="packet")this.stage.apply(op,false);this.ui.onPause(this.i);}
}

 const prompt=`You write short animated lessons for an AZ-104 (Microsoft Azure Administrator) study app. Topic requested by the learner: "${topic}".

${GEN_SPEC}

{"title": short lesson title,
 "domain": one of "identity","storage","compute","network","monitor",
 "keywords": [6-10 search keywords],
 "scenes": [6-8 scenes],
 "takeaways": [3-5 exam-relevant facts],

  .then(raw=>{const L=cleanLesson(raw,slug,topic);if(!L)throw {code:"invalid_json"};GEN[slug]=L;saveGen(slug);toast("Lesson ready");go("player",slug);})
  .catch(e=>{if(e&&e.code==="cancelled")return;

   stop.textContent="Back";});
}
function cleanLesson(r,slug,topic){if(!r||typeof r!=="object"||!Array.isArray(r.scenes))return null;
 const str=(v,n)=>String(v==null?"":v).slice(0,n);
 const scenes=r.scenes.slice(0,10).map(s=>({say:str(s&&s.say,320),ops:(Array.isArray(s&&s.ops)?s.ops:[]).filter(o=>o&&OPS.includes(o.op)).slice(0,14).map(o=>{const c={op:o.op};
   ["id","k","label","sub","text","title","from","to","style","tone"].forEach(k=>{if(o[k]!=null)c[k]=str(o[k],k==="text"?300:80);});
   ["x","y","w","h","row"].forEach(k=>{if(o[k]!=null)c[k]=Number(o[k]);});
   if(o.blocked)c.blocked=true;if(Array.isArray(o.path))c.path=o.path.slice(0,6).map(x=>str(x,40));if(Array.isArray(o.rows))c.rows=o.rows.slice(0,7).map(rw=>(Array.isArray(rw)?rw:[rw]).slice(0,4).map(x=>str(x,48)));return c;})})).filter(s=>s.say);
 if(scenes.length<2)return null;

 const dom=["identity","storage","compute","network","monitor"].includes(r.domain)?r.domain:"network";
 const L={id:slug,title:str(r.title||topic,70),domain:dom,mins:Math.max(1,Math.round(scenes.length*.35)),keywords:(Array.isArray(r.keywords)?r.keywords:[]).slice(0,12).map(x=>str(x,40)).concat([topic.toLowerCase()]),
  scenes,takeaways:(r.takeaways||[]).slice(0,6).map(x=>str(x,240)),traps:(r.traps||[]).slice(0,4).map(x=>str(x,240)),mnemonic:str(r.mnemonic,200),lab:str(r.lab,400),ref,generated:true};
 L.questions=(Array.isArray(r.questions)?r.questions:[]).slice(0,6).map((q,i)=>cleanQ(q,slug+"-q"+i,slug)).filter(Boolean);
 return L;}
