 e:"Overlapping address spaces block peering. Region and subscription differences are fine.",
 w:["Global peering is supported, but overlapping ranges block it first.","","Cross-subscription (even cross-tenant) peering is supported.","There is no IPv6-only fallback."]},
{id:"pe5",l:"peer",t:"order",s:"You need to connect VNet1 and VNet2, which are in different subscriptions, with VNet peering, and verify connectivity. Which four actions should you perform in sequence?",
 items:["Confirm the VNet address spaces don't overlap","Create the peering link from VNet1 to VNet2","Create the peering link from VNet2 to VNet1","Verify both peerings show Connected and test VM connectivity"],extra:["Deploy a VPN gateway in each VNet","Enable a service endpoint on both VNets"],
 e:"Check address spaces, create both links (order between the two links doesn't matter, but both are required), then verify. No gateways are needed for peering."},

/* --- public IP --- */
{id:"ip1",l:"pip",t:"mc",s:"You create a VM with a Standard SKU public IP and no NSG. Users can't connect to the website on port 80. Why?",o:["Standard public IPs are dynamic and the IP changed","Standard public IPs block inbound traffic until an NSG allows it","Standard public IPs support only outbound traffic","Port 80 is blocked by Azure platform policy"],a:1,
 e:"Standard public IPs are secure by default. Add an NSG with an inbound allow rule for port 80.",
 w:["Standard public IPs are always static.","","They support inbound once an NSG allows it.","Azure doesn't block port 80 for public IPs."]},
{id:"ip2",l:"pip",t:"mc",s:"You need a public IP for a Standard load balancer that must survive the failure of an availability zone. Which configuration should you use?",o:["Basic SKU, static","Standard SKU, zone-redundant","Standard SKU, zonal in zone 1","Basic SKU, dynamic"],a:1,
 e:"Standard SKU is required to match the Standard LB, and zone-redundant keeps the IP available if a zone fails.",
 w:["Basic doesn't match a Standard LB, and Basic public IPs are retired.","","A zonal IP lives in one zone and fails with it.","Basic dynamic doesn't match the LB and isn't zone-aware."]},
{id:"ip3",l:"pip",t:"mc",s:"Fifty VMs in one subnet need outbound internet access from a single, predictable IP. They must not accept inbound connections from the internet. What should you use?",o:["A public IP on each VM","A NAT gateway associated with the subnet","An internal load balancer","Azure Bastion"],a:1,
 e:"A NAT gateway gives a subnet outbound connectivity through its static public IP(s) and allows no unsolicited inbound traffic.",
 w:["Fifty public IPs means fifty addresses and inbound exposure.","","An internal LB has no internet path.","Bastion is for admin RDP/SSH, not outbound traffic."]},

/* --- UDR --- */
{id:"ud1",l:"udr",t:"mc",s:"You must send all traffic from Subnet1 to the internet through a firewall appliance at 10.0.9.4. Which route should you add to the route table associated with Subnet1?",o:["0.0.0.0/0 → Internet","0.0.0.0/0 → Virtual appliance, 10.0.9.4","10.0.9.4/32 → Virtual network","0.0.0.0/0 → None"],a:1,
 e:"A default route to next hop type Virtual appliance with the NVA's IP forces internet-bound traffic through it.",
 w:["That's the system default route and bypasses the firewall.","","This only routes traffic to the appliance's own IP.","None drops the traffic entirely."]},
{id:"ud2",l:"udr",t:"mc",s:"You configured a UDR that sends traffic through an NVA VM. Packets reach the NVA but are never forwarded. The NVA's OS routing is configured correctly. What should you change?",o:["Enable IP forwarding on the NVA's network interface","Add a public IP to the NVA","Associate the route table with the NVA's NIC","Change the next hop type to Internet"],a:0,
 e:"Azure drops traffic not addressed to a NIC unless IP forwarding is enabled on that NIC.",
 w:["","A public IP doesn't enable forwarding.","Route tables associate with subnets, not NICs.","This would bypass the NVA."]},
{id:"ud3",l:"udr",t:"mc",s:"A subnet's route table has 10.0.0.0/16 → Virtual appliance and 10.0.5.0/24 → Virtual network. Traffic is sent to 10.0.5.20. Which route is used?",o:["10.0.0.0/16, because UDRs are processed top-down","10.0.5.0/24, because it's the longest prefix match","Both, load-balanced","Neither; the system route wins"],a:1,
 e:"Azure uses longest prefix match: /24 is more specific than /16.",
 w:["Route order in the table doesn't matter.","","Azure picks exactly one route.","System routes only win when no UDR or BGP route has an equal or longer prefix."]},
{id:"ud4",l:"udr",t:"hot",s:"Complete the statements about route tables.",parts:[{p:"A route table is associated with…",o:["a VM","a subnet","a NIC"],a:1},{p:"Each subnet can have…",o:["zero or one route table","up to five route tables","exactly one route table"],a:0},{p:"For an equal prefix, the route that wins is…",o:["System route","BGP route","User-defined route"],a:2}],
 e:"Route tables attach to subnets (0 or 1 per subnet). With equal prefixes, UDR beats BGP, which beats system routes."},
{id:"ud5",l:"udr",t:"mc",s:"You need to block all traffic from SubnetA to 192.168.50.0/24 using routing only. Which next hop type should the route use?",o:["Virtual network gateway","Internet","None","Virtual appliance"],a:2,
 e:"Next hop type None drops matching traffic.",
 w:["Sends traffic to the VPN gateway.","Sends traffic to the internet.","","Sends traffic to an NVA."]},

/* --- NSG --- */
{id:"ns1",l:"nsg",t:"mc",s:"An NSG has: priority 200 Allow TCP 3389 from Any; priority 150 Deny TCP 3389 from Internet. An admin connects from the internet on port 3389. What happens?",o:["Allowed, because Allow rules win","Denied, because priority 150 is processed first","Allowed, because 200 is the higher priority","Denied, because of DenyAllInBound"],a:1,
 e:"Lower number = processed first. 150 matches and denies; processing stops.",
 w:["There's no Allow-wins rule. The first match decides.","","A higher number means lower priority.","The traffic matched rule 150 long before 65500."]},
{id:"ns2",l:"nsg",t:"mc",s:"Subnet1 has NSG1, which allows inbound TCP 443. VM1's NIC in Subnet1 has NSG2 with only the default rules. Can internet users reach VM1 on 443?",o:["Yes, NSG1 allows it","No, NSG2's DenyAllInBound blocks it","Yes, because NIC NSGs only filter outbound","No, because NSGs can't be on both subnet and NIC"],a:1,
 e:"Inbound traffic must pass the subnet NSG and then the NIC NSG. NSG2's default DenyAllInBound blocks internet traffic.",
 w:["Passing NSG1 is only half the path.","","NIC NSGs filter both directions.","Associating both is allowed and common."]},
{id:"ns3",l:"nsg",t:"ms",pick:2,s:"Which two statements about NSG default rules are true? Each correct answer presents a complete fact.",
 o:["They can be deleted if no custom rules exist","AllowVnetInBound allows traffic between resources in the VNet and peered VNets","They can be overridden with custom rules of a lower priority number","DenyAllInBound has priority 100"],a:[1,2],
 e:"Default rules can't be deleted but can be overridden by custom rules with a lower number (higher priority). VirtualNetwork includes peered VNets.",
 w:["Default rules can't be deleted.","","","DenyAllInBound is 65500."]},
{id:"ns4",l:"nsg",t:"mc",s:"An NSG allows inbound TCP 443 to a web VM. There are no custom outbound rules. Do response packets reach the client?",o:["No, add an outbound allow rule for 443","Yes, because NSGs are stateful","No, because DenyAllOutBound blocks them","Only if the VM has a public IP"],a:1,
 e:"NSGs track connections; return traffic of an allowed flow is allowed automatically.",
 w:["Not needed; NSGs are stateful.","","Stateful tracking bypasses outbound rules for replies.","The public IP isn't relevant to statefulness."]},
{id:"ns5",l:"nsg",t:"mc",s:"You need an NSG rule that allows a VM to reach Azure Storage in any region, without maintaining IP lists. What should you use as the destination?",o:["The Storage service tag","An application security group","The VirtualNetwork service tag","The storage account's current public IP"],a:0,
 e:"Service tags represent Microsoft-managed IP ranges that update automatically.",
 w:["","ASGs group your own NICs, not Azure services.","VirtualNetwork covers your VNet address spaces only.","Storage IPs can change; that's what service tags avoid."]},
{id:"ns6",l:"nsg",t:"hot",s:"VM1 is in Subnet1. Subnet1 has NSG-A; VM1's NIC has NSG-B. Complete the evaluation order.",parts:[{p:"Inbound traffic is evaluated by…",o:["NSG-A, then NSG-B","NSG-B, then NSG-A","whichever has the lower priority rule"],a:0},{p:"Outbound traffic is evaluated by…",o:["NSG-A, then NSG-B","NSG-B, then NSG-A","only NSG-A"],a:1}],
 e:"Inbound: subnet then NIC. Outbound: NIC then subnet."},

/* --- ASG / effective rules --- */
{id:"as1",l:"asg",t:"mc",s:"You add 10 new web VMs regularly. NSG rules must allow port 8080 from web VMs to app VMs without editing rules each time. What should you use?",o:["Service tags","Application security groups","A separate NSG per VM","User-defined routes"],a:1,
 e:"Put web NICs in asg-web and app NICs in asg-app, and reference the ASGs in one rule.",
 w:["Service tags represent Azure services, not your VMs.","","More NSGs means more rules to edit.","UDRs control routing, not filtering."]},
{id:"as2",l:"asg",t:"mc",s:"You try to add VM5's NIC (in VNet2) to asg-app, whose existing members are in VNet1. What happens?",o:["It succeeds","It fails; all NICs in an ASG must be in the same VNet","It succeeds only if the VNets are peered","It succeeds only if VM5 is stopped"],a:1,
 e:"An ASG's NICs must all be in the same VNet.",
 w:["Cross-VNet membership isn't allowed.","","Peering doesn't change this rule.","VM state doesn't matter."]},
{id:"as3",l:"asg",t:"mc",s:"VM1 can't receive RDP. Subnet and NIC both have NSGs. You need to see the combined set of rules applied to VM1. What should you use?",o:["Effective security rules on VM1's NIC","Azure Advisor","Activity log","Effective routes"],a:0,
 e:"Effective security rules merge subnet and NIC NSGs into what actually applies to the NIC.",
 w:["","Advisor gives recommendations, not rule evaluation.","The activity log shows management operations.","Effective routes show routing, not filtering."]},
{id:"as4",l:"asg",t:"mc",s:"You need to know whether inbound TCP 22 from 203.0.113.10 to VM2 is allowed, and which rule decides it. Which Network Watcher feature should you use?",o:["Next hop","IP flow verify","Packet capture","Connection monitor"],a:1,
 e:"IP flow verify tests one flow and returns Allow/Deny plus the rule name.",
 w:["Next hop shows routing.","","Packet capture records traffic but doesn't evaluate rules.","Connection monitor tracks reachability over time."]},

/* --- Bastion --- */
{id:"ba1",l:"bastion",t:"mc",s:"You're deploying Azure Bastion into VNet1. What must the dedicated subnet be named?",o:["BastionSubnet","AzureBastionSubnet","GatewaySubnet","snet-bastion"],a:1,
 e:"Bastion requires a subnet named exactly AzureBastionSubnet.",
 w:["Close, but the name must be exact.","","GatewaySubnet is for VPN/ExpressRoute gateways.","Custom names aren't accepted."]},
{id:"ba2",l:"bastion",t:"mc",s:"What is the minimum size for the AzureBastionSubnet?",o:["/29","/28","/27","/26"],a:3,
 e:"The subnet must be /26 or larger.",
 w:["Too small.","Too small.","Too small for current requirements.",""]},
{id:"ba3",l:"bastion",t:"mc",s:"Admins want to connect to VMs through Bastion using the RDP client installed on their Windows PCs. Which is the lowest SKU that supports this?",o:["Developer","Basic","Standard","Premium"],a:2,
 e:"Native client support starts at Standard.",
 w:["Developer is portal-only and shared.","Basic is portal-only.","","Premium supports it but isn't the lowest."]},
{id:"ba4",l:"bastion",t:"ms",pick:2,s:"Which two statements about Azure Bastion are true? Each correct answer presents a complete fact.",
 o:["Target VMs need a public IP","Connections from the browser use TLS over port 443","A Bastion in a hub VNet can connect to VMs in peered spoke VNets","Bastion requires the Network Watcher extension on VMs"],a:[1,2],
 e:"Bastion uses HTTPS/443 from the browser and can reach VMs in peered VNets. VMs need no public IP or extension.",
 w:["Removing VM public IPs is the point of Bastion.","","","No VM extension is required."]},

/* --- endpoints --- */
{id:"ep1",l:"endpoints",t:"mc",s:"On-premises servers connected through site-to-site VPN must reach a storage account privately, without using its public endpoint. What should you configure?",o:["A service endpoint on the gateway subnet","A private endpoint for the storage account","A storage firewall rule for the VPN gateway's public IP","A NAT gateway"],a:1,
 e:"Private endpoints give the resource a private IP in your VNet that on-premises clients can reach over VPN (with DNS configured).",
 w:["Service endpoints don't extend to on-premises traffic.","","That still uses the public endpoint.","NAT gateway is for outbound internet traffic."]},
{id:"ep2",l:"endpoints",t:"mc",s:"You create a private endpoint for stdata01 (blob). VMs still resolve stdata01.blob.core.windows.net to a public IP. What's missing?",o:["A service endpoint","A private DNS zone privatelink.blob.core.windows.net linked to the VNet","A route table","An NSG rule allowing port 443"],a:1,
 e:"Name resolution must return the private IP. Use the privatelink private DNS zone linked to the VNet.",
 w:["Service endpoints don't change DNS.","","Routing isn't the issue; resolution is.","NSGs don't affect DNS answers."]},
{id:"ep3",l:"endpoints",t:"mc",s:"You want VMs in Subnet1 to access a storage account over the Azure backbone and block all other networks, at no extra cost. A public endpoint may remain. What should you do?",o:["Create a private endpoint","Enable a Microsoft.Storage service endpoint on Subnet1 and allow Subnet1 in the storage firewall","Peer the VNet with the storage account","Add a UDR to the storage account"],a:1,
 e:"Service endpoints are free and let the storage firewall allow specific subnets.",
 w:["Works, but has hourly and data costs, which the question rules out.","","You can't peer with a storage account.","UDRs don't attach to storage accounts."]},
{id:"ep4",l:"endpoints",t:"hot",s:"Compare the endpoint types.",parts:[{p:"Gives the resource a private IP in your VNet:",o:["Service endpoint","Private endpoint","Both"],a:1},{p:"Usable from on-premises over VPN:",o:["Service endpoint","Private endpoint","Both"],a:1},{p:"Configured per subnet, per Azure service:",o:["Service endpoint","Private endpoint","Both"],a:0}],
 e:"Private endpoints create a NIC with a private IP and work from on-premises. Service endpoints are enabled per subnet for a service."},
{id:"ep5",l:"endpoints",t:"mc",s:"After creating a private endpoint for a SQL database, the security team requires that the database be unreachable from the internet. What should you do?",o:["Nothing; private endpoints disable public access","Set Public network access to Disabled on the server","Delete the server's firewall rules only","Add a service endpoint"],a:1,
 e:"A private endpoint adds a private path but doesn't turn off public access. Disable public network access explicitly.",
 w:["This is the common misconception.","","Disabling public network access is the definitive setting.","Service endpoints don't remove public access."]},

/* --- DNS --- */
{id:"dn1",l:"dns",t:"mc",s:"You created the public zone contoso.com in Azure DNS. Internet clients still get answers from the old provider. What should you do?",o:["Create a private DNS zone","Update the NS records at the domain registrar to Azure's name servers","Add an A record for @","Link the zone to a VNet"],a:1,
 e:"Delegation happens at the registrar: point the domain's NS records at the four Azure name servers.",
 w:["Private zones aren't visible on the internet.","","Records in Azure don't matter until the domain is delegated.","Linking is for private zones."]},
{id:"dn2",l:"dns",t:"mc",s:"You need contoso.com (the apex) to point to a Standard public IP and follow it automatically if the IP changes. What record should you create?",o:["CNAME at @","Alias A record at @ targeting the public IP resource","A record with the current IP","TXT record"],a:1,
 e:"Alias records target Azure resources, stay in sync, and are allowed at the apex.",
 w:["CNAME isn't allowed at the zone apex.","","A static A record won't follow changes.","TXT doesn't resolve to an IP."]},
{id:"dn3",l:"dns",t:"mc",s:"VMs in VNet1 must automatically get DNS records in the private zone corp.contoso.local. What should you configure?",o:["A virtual network link with auto-registration enabled","An A record for each VM","Custom DNS servers on VNet1","A public DNS zone"],a:0,
 e:"Enable auto-registration on the zone's virtual network link to VNet1.",
 w:["","Manual records work but aren't automatic.","Custom DNS servers don't create records.","Public zones aren't for private VNet names."]},
{id:"dn4",l:"dns",t:"mc",s:"VNet1 already has a link with auto-registration to zone1.local. You try to enable auto-registration on a link to zone2.local. What happens?",o:["It succeeds; both zones register","It fails; a VNet can have auto-registration with only one private zone","It succeeds after peering","It replaces zone1's link"],a:1,
 e:"A VNet can link to many private zones but auto-register in only one.",
 w:["Only one auto-registration zone per VNet.","","Peering doesn't change this.","Azure doesn't silently replace links."]},
{id:"dn5",l:"dns",t:"mc",s:"You changed VNet1's DNS servers to custom servers 10.0.0.10 and 10.0.0.11. Existing VMs keep using Azure DNS. What should you do?",o:["Restart the VMs (or renew DHCP)","Delete and recreate the VNet","Add a private DNS zone","Change the NSG"],a:0,
 e:"VMs pick up new DNS settings on restart or DHCP lease renewal.",
 w:["","Not necessary.","Unrelated to the DNS server setting.","NSGs don't control DHCP options."]},
{id:"dn6",l:"dns",t:"hot",s:"Choose the record type.",parts:[{p:"Route email for contoso.com:",o:["MX","CNAME","AAAA"],a:0},{p:"Point www to contoso.azurewebsites.net:",o:["A","CNAME","NS"],a:1},{p:"Prove domain ownership to a SaaS vendor:",o:["TXT","SOA","PTR"],a:0}],
 e:"MX for mail, CNAME for name-to-name, TXT for verification."},

/* --- LB --- */
{id:"lb1",l:"lb",t:"mc",s:"All VMs behind a Standard load balancer show as unhealthy. The web service runs on each VM. An NSG on the subnet has a custom rule at priority 100 denying all inbound traffic from Any. What's the fix?",o:["Allow the AzureLoadBalancer service tag at a priority lower than 100","Change to a Basic load balancer","Add public IPs to the VMs","Enable session persistence"],a:0,
 e:"Health probes come from 168.63.129.16 (AzureLoadBalancer tag). The custom deny at 100 overrides the default allow at 65001.",
 w:["","Basic LB is retired and wouldn't fix the block.","Public IPs don't affect probes.","Persistence doesn't affect health."]},
{id:"lb2",l:"lb",t:"mc",s:"Users of a shopping app behind a load balancer lose their cart when a request lands on a different VM. You must keep each client on the same VM. What should you configure?",o:["Session persistence: Client IP","A second health probe","Inbound NAT rules","Floating IP"],a:0,
 e:"Session persistence (source IP affinity) sends a client's requests to the same backend.",
 w:["","Probes check health, not affinity.","NAT rules map ports to single VMs.","Floating IP is for specific scenarios like SQL AGs."]},
{id:"lb3",l:"lb",t:"mc",s:"You need to route /images/* to one pool and /api/* to another, and add a web application firewall. Which service should you use?",o:["Azure Load Balancer","Application Gateway","Traffic Manager","NAT gateway"],a:1,
 e:"Path-based routing and WAF are layer-7 features of Application Gateway.",
 w:["Load Balancer is layer 4 and can't see URLs.","","Traffic Manager is DNS-based.","NAT gateway is for outbound connectivity."]},
{id:"lb4",l:"lb",t:"mc",s:"You need RDP access to a specific VM through the public load balancer's frontend on port 50001. What should you create?",o:["A load-balancing rule","An inbound NAT rule","An outbound rule","A health probe on 3389"],a:1,
 e:"Inbound NAT rules map a frontend port to one backend VM's port.",
 w:["LB rules spread traffic across the pool.","","Outbound rules configure SNAT.","Probes check health; they don't forward traffic."]},
{id:"lb5",l:"lb",t:"order",s:"You need to publish a web app on two VMs using a new public Standard load balancer. Which four actions should you perform in sequence?",
 items:["Create a Standard public IP and the load balancer frontend","Create a backend pool with both VMs' NICs","Create a health probe for HTTP port 80","Create a load-balancing rule for TCP 80 using the probe"],extra:["Create an inbound NAT rule for port 80","Create a Basic public IP"],
 e:"Frontend → backend pool → probe → rule (the rule references the frontend, pool and probe)."},
{id:"lb6",l:"lb",t:"mc",s:"You need to load balance a SQL Server tier that must not be reachable from the internet. Which configuration should you use?",o:["Public load balancer","Internal load balancer with a private frontend IP","Application Gateway with WAF","Traffic Manager"],a:1,
 e:"An internal load balancer uses a private frontend IP inside the VNet.",
 w:["A public LB exposes a public IP.","","App Gateway is for HTTP(S), not SQL.","Traffic Manager is DNS-based and global."]},

/* --- Network Watcher --- */
{id:"nw1",l:"nw",t:"mc",s:"Traffic from VM1 to 10.20.0.5 is going somewhere unexpected. You need to know the next hop type and which route table is responsible. What should you use?",o:["IP flow verify","Next hop","NSG diagnostics","Connection monitor"],a:1,
 e:"Next hop returns the next hop type, IP address and the route table (or system route) used.",
 w:["IP flow verify checks NSG filtering, not routing.","","NSG diagnostics checks security rules.","Connection monitor tracks reachability over time."]},
{id:"nw2",l:"nw",t:"mc",s:"You need to capture network traffic on VM3 for 10 minutes to analyze it in Wireshark. What's required on the VM?",o:["Azure Bastion","The Network Watcher agent VM extension","A public IP","Boot diagnostics"],a:1,
 e:"Packet capture uses the Network Watcher agent extension on the VM.",
 w:["Bastion is for remote access.","","Not required.","Boot diagnostics captures console output, not packets."]},
{id:"nw3",l:"nw",t:"mc",s:"You need to continuously monitor latency and reachability between an Azure VM and an on-premises server, with alerts. What should you use?",o:["Connection troubleshoot","Connection monitor","IP flow verify","Packet capture"],a:1,
 e:"Connection monitor tracks connectivity and latency over time and integrates with alerts.",
 w:["Connection troubleshoot is a one-time check.","","IP flow verify evaluates NSG rules once.","Packet capture records traffic for a period."]},
{id:"nw4",l:"nw",t:"mc",s:"Your team wants to start logging IP traffic for a VNet for analysis with Traffic analytics. Which option should you choose for new deployments?",o:["NSG flow logs","Virtual network flow logs","Activity log","Boot diagnostics"],a:1,
 e:"VNet flow logs replace NSG flow logs, which are being retired.",
 w:["Being retired; new NSG flow logs can't be created.","","The activity log records control-plane operations.","Unrelated to traffic logging."]},

/* --- Case study: Fabrikam --- */
{id:"cf1",l:"udr",case:"fabrikam",t:"ms",pick:2,s:"You need to meet requirement 1. Which two actions should you perform? Each correct answer presents part of the solution.",
 o:["Create route tables in both spokes with routes to the other spoke via next hop Virtual appliance 10.0.3.4","Enable IP forwarding on nva-fw's NIC","Peer vnet-spoke1 directly with vnet-spoke2","Enable gateway transit on the spokes"],a:[0,1],
 e:"Spoke-to-spoke through the firewall needs UDRs in both directions (avoid asymmetric routing) and IP forwarding on the NVA's NIC. The spoke peerings also need Allow forwarded traffic.",
 w:["","","Direct peering would bypass nva-fw, violating the requirement.","Gateway transit is for sharing the VPN gateway."]},
{id:"cf2",l:"endpoints",case:"fabrikam",t:"mc",s:"You need to meet requirement 2. What should you deploy?",o:["A service endpoint for Microsoft.Storage in vnet-hub","A private endpoint for stfabdocs plus DNS resolution for head office","A NAT gateway","A storage firewall rule allowing the head office public IP"],a:1,
 e:"Only private endpoints are reachable from on-premises over VPN without a public endpoint. On-premises DNS must resolve the privatelink name to the private IP.",
 w:["Service endpoints don't apply to on-premises traffic.","","NAT gateway is outbound-only internet access.","That uses the public endpoint."]},
{id:"cf3",l:"bastion",case:"fabrikam",t:"mc",s:"You need to meet requirement 3 at the lowest cost. What should you deploy in vnet-hub?",o:["Azure Bastion Basic","Azure Bastion Standard","Azure Bastion Developer","A jump box VM with a public IP"],a:1,
 e:"The local RDP client means native client support, which starts at Standard. A hub bastion reaches peered spokes.",
 w:["Basic is portal-only.","","Developer is portal-only and dev/test.","A public IP violates the requirement."]},
{id:"cf4",l:"peer",case:"fabrikam",t:"hot",s:"You need to meet requirement 4. Configure the peering settings.",parts:[{p:"Hub → spoke peerings:",o:["Allow gateway transit","Use remote gateways","Block forwarded traffic"],a:0},{p:"Spoke → hub peerings:",o:["Allow gateway transit","Use remote gateways","Disable peering"],a:1}],
 e:"The hub shares its gateway; spokes use remote gateways."},

/* --- Yes/No series --- */
{id:"y1",l:"nsg",series:"s1",t:"yn",s:"VM1 is in Subnet1 of VNet1. Subnet1 has NSG1. Users report they can't reach a web app on VM1 on TCP 8080 from the internet. VM1 has a Standard public IP. NSG1 contains only the default rules.\n\nGoal: Allow internet users to reach the app on TCP 8080.",
 sol:"Solution: You add an inbound rule to NSG1: priority 300, source Internet, destination port 8080, Allow.",a:true,
 e:"An inbound allow rule for 8080 at priority 300 beats DenyAllInBound (65500). No NIC NSG exists, so this meets the goal."},
{id:"y2",l:"nsg",series:"s1",t:"yn",s:"VM1 is in Subnet1 of VNet1. Subnet1 has NSG1. Users report they can't reach a web app on VM1 on TCP 8080 from the internet. VM1 has a Standard public IP. NSG1 contains only the default rules.\n\nGoal: Allow internet users to reach the app on TCP 8080.",
 sol:"Solution: You add an outbound rule to NSG1 allowing TCP 8080 to Internet.",a:false,
 e:"The problem is inbound. NSGs are stateful, so outbound rules don't open inbound traffic."},
{id:"y3",l:"nsg",series:"s1",t:"yn",s:"VM1 is in Subnet1 of VNet1. Subnet1 has NSG1. Users report they can't reach a web app on VM1 on TCP 8080 from the internet. VM1 has a Standard public IP. NSG1 contains only the default rules.\n\nGoal: Allow internet users to reach the app on TCP 8080.",
 sol:"Solution: You change VM1's public IP to a Basic SKU, which is open by default.",a:false,
 e:"Basic public IPs are retired and can't be used for new deployments, and NSG1's DenyAllInBound would still block the traffic."}
];

/* ===== Flashcards: exam traps ===== */
const CARDS=[
 {l:"vnet",f:"How many IPs does Azure reserve per subnet?",b:"5: .0 network, .1 gateway, .2 and .3 DNS, last address broadcast."},
 {l:"vnet",f:"Smallest IPv4 subnet in Azure?",b:"/29: 8 addresses, 3 usable."},
 {l:"peer",f:"Is VNet peering transitive?",b:"No. A↔B and B↔C does not give A↔C. Use direct peering or an NVA in the hub with UDRs."},
 {l:"peer",f:"Peering shows Initiated. Why?",b:"Only one side exists. Create the reverse peering."},
 {l:"peer",f:"Share a hub VPN gateway with spokes?",b:"Hub: Allow gateway transit. Spoke: Use remote gateways."},
 {l:"pip",f:"Standard public IP: inbound by default?",b:"Blocked until an NSG allows it. Always static, and can be zone-redundant."},
 {l:"pip",f:"Outbound internet for many VMs, no inbound?",b:"NAT gateway on the subnet."},
 {l:"udr",f:"NVA receives but doesn't forward traffic?",b:"Enable IP forwarding on its NIC (and in the OS)."},

LESSONS.users={id:"users",title:"Users, guests & bulk operations",mins:2,
 keywords:["entra id","azure ad","user","guest","b2b","external user","bulk create","csv","deleted user","restore","usage location","synced user","entra connect","external collaboration"],
 scenes:[
  {say:"Microsoft Entra ID is the identity service behind Azure. Every person who signs in is a user object in your tenant.",
   ops:[B("t","tenant",40,40,"contoso.onmicrosoft.com","Entra tenant",460,460),B("u1","user",80,110,"Priya Shah","Member · cloud",230)]},
  {say:"Cloud users are created directly in Entra ID. Synced users come from on-premises Active Directory, so you edit most of their properties on-premises.",
   ops:[B("u2","user",80,200,"Dev Rao","Member · synced",230),B("ad","onprem",680,200,"On-prem AD","Entra Connect",200),L("sy","ad","u2","sync","dash"),P(["ad","u2"],"sync","signal")]},
  {say:"Guests are external people invited by email through Entra B2B. Their user type is Guest, and they sign in with their own organization's account.",
   ops:[B("g","user",80,290,"sam@fabrikam.com","Guest · B2B",230),B("mail","mail",680,290,"Invitation","redeem link",200),P(["mail","g"],"invite","ok")]},
  {say:"External collaboration settings control who can invite guests, what guests can see, and which domains are allowed or blocked.",
   ops:[...D("mail","ad","sy"),T("ec",530,60,[["Setting","Example"],["Guest invite settings","Admins + Guest Inviter role"],["Guest user access","Own directory objects only"],["Collaboration restrictions","Allow only fabrikam.com"]],"External collaboration settings")]},
  {say:"Need hundreds of users? Use bulk create. Download the CSV template, fill it in, and upload it. Bulk invite works the same way for guests.",
   ops:[...D("ec"),B("csv","app",620,150,"users.csv","Bulk create",180),B("u3","users",80,380,"+ 499 more users","from CSV",230),P(["csv","u3"],"upload","ok")]},
  {say:"Deleted a user by mistake? Deleted users can be restored for thirty days. After that, they're gone for good.",
   ops:[...D("csv"),M("u1","bad"),SET("u1","Priya Shah","Deleted · restorable"),N("n1",540,150,"Deleted users: restore within 30 days\nthen permanently deleted","accent")]},
  {say:"Before you can assign a license, the user needs a usage location. It's a required property, and the exam loves it.",
   ops:[M("u1"),SET("u1","Priya Shah","Member · restored"),...D("n1"),N("n2",540,150,"License assignment needs Usage location\n(for example India or United States)","bad")]}
 ],
 takeaways:["Cloud users are managed in Entra ID; synced users are managed in on-premises AD.","Guests (B2B) have user type Guest and use their home account to sign in.","External collaboration settings control who can invite and which domains are allowed.","Bulk create and bulk invite use a CSV template from the portal.","Deleted users are restorable for 30 days. Usage location is required before assigning licenses."],
 traps:["You can't edit most attributes of a synced user (like name or department) in Entra ID. Change them in on-premises AD.","Guests can be given Azure RBAC roles like any member."],
 mnemonic:"30 days to undo, a Location before a License.",
 lab:"In Entra ID, create a cloud user, invite a guest with a personal email, then delete the cloud user and restore it from Deleted users.",
 ref:"https://learn.microsoft.com/en-us/entra/fundamentals/how-to-create-delete-users"};

LESSONS.groups={id:"groups",title:"Groups & dynamic membership",mins:3,
 keywords:["group","security group","microsoft 365 group","dynamic group","dynamic membership","membership rule","assigned","administrative unit","group-based licensing","nested group"],
 scenes:[
  {say:"Groups let you manage access and licenses for many users at once. There are two types: Security groups and Microsoft 365 groups.",
   ops:[B("t","tenant",40,40,"Entra ID","groups",420,460),B("sg","users",80,110,"sg-Finance","Security group",230),B("m3","users",80,210,"Finance Team","Microsoft 365 group",230),
        T("gt",490,40,[["","Security","Microsoft 365"],["Use for","Access, licenses","Mail, Teams, files"],["Members","Users, devices, groups","Users only"],["Mail-enabled","Optional","Always"]],"Group types")]},
  {say:"Membership can be assigned, where you add people manually, or dynamic, where a rule adds and removes members automatically.",
   ops:[...D("gt"),B("dg","users",80,310,"sg-Sales-India","Dynamic user",230),T("rule",490,60,[["Dynamic membership rule"],["(user.department -eq \"Sales\")"],["-and (user.country -eq \"India\")"]])]},
  {say:"When a user's department changes to Sales, they join automatically. When it changes back, they're removed.",
   ops:[B("nu","user",600,250,"Arjun","department: Sales",190),P(["nu","dg"],"joins","ok")]},
  {say:"Dynamic groups need Microsoft Entra ID P1 licenses. Dynamic device groups are possible only with Security groups.",
   ops:[...D("rule","nu"),N("n1",490,80,"Dynamic membership → Entra ID P1\nDynamic device → Security groups only","bad")]},
  {say:"Security groups can contain other groups. Microsoft 365 groups can't be nested.",
   ops:[N("n2",490,190,"Nesting: Security ✓    Microsoft 365 ✗","accent")]},
  {say:"Assign a license to a group and every member gets it. That's group-based licensing, and it's far easier than assigning per user.",
   ops:[...D("n1","n2"),B("lic","license",600,110,"Microsoft 365 E5","group-based",210),L("ll","lic","sg","license","ok")]},
  {say:"Administrative units delegate management of part of the directory. For example, a regional help desk that manages only users in India.",
   ops:[B("au","group",490,250,"Administrative unit: India","",420,220),B("hd","role",530,310,"Helpdesk Administrator","scoped to this AU",280)]}
 ],
 takeaways:["Security groups: access and licenses; can hold users, devices and other groups.","Microsoft 365 groups: collaboration (mail, Teams, SharePoint); users only; can't be nested.","Dynamic membership (user or device rules) requires Entra ID P1. Dynamic device needs a Security group.","Group-based licensing assigns licenses to every member.","Administrative units scope Entra admin roles to a subset of users, groups or devices."],
 traps:["You can't manually add members to a dynamic group. The rule decides.","An existing assigned group can be switched to dynamic, but its manual members are then replaced by the rule's results."],
 mnemonic:"Security = Locks & Licenses. Microsoft 365 = Mail & Meetings.",
 lab:"Create a dynamic user group with the rule user.department -eq \"Sales\". Set a test user's department to Sales and watch them join (it can take a few minutes).",
 ref:"https://learn.microsoft.com/en-us/entra/fundamentals/concept-learn-about-groups"};

LESSONS.sspr={id:"sspr",title:"Licenses & self-service password reset",mins:2,
 keywords:["sspr","self-service password reset","password reset","authentication methods","password writeback","license","entra id p1","usage location"],
 scenes:[
  {say:"Self-service password reset, or SSPR, lets users reset a forgotten password without calling the help desk.",
   ops:[B("u","user",60,200,"Priya","forgot password"),B("sp","key",380,200,"SSPR","aka.ms/sspr"),B("ok","app",720,200,"Signed in","new password"),P(["u","sp","ok"],"reset","ok")]},
  {say:"You enable it for None, Selected, or All. Selected means exactly one group, which is handy for a pilot.",
   ops:[T("sc",60,320,[["SSPR enabled","Who can reset"],["None","Nobody"],["Selected","One group, e.g. sg-SSPR-Pilot"],["All","Every user"]],"Properties")]},
  {say:"Next, choose the authentication methods, and whether one or two are required to reset.",
   ops:[...D("sc"),T("am",60,320,[["Method","Notes"],["Microsoft Authenticator","Notification or code"],["Mobile phone","Text or call"],["Email","Alternate address"],["Security questions","Not for admins"]],"Methods · required: 1 or 2")]},
  {say:"Administrators are a special case. SSPR is always on for admin roles, they must use two methods, and they can't use security questions.",
   ops:[N("n1",500,330,"Admins: always enabled · 2 methods\nno security questions","bad")]},
  {say:"Synced users need password writeback, so the new password is written back to on-premises Active Directory. That needs Entra ID P1 plus Entra Connect or Cloud Sync.",
   ops:[...D("am","n1"),B("ad","onprem",720,380,"On-prem AD","writeback target"),L("wb","sp","ad","password writeback","dash"),P(["sp","ad"],"","signal")]},
  {say:"Licensing: resetting forgotten passwords needs Entra ID P1 or P2, or certain Microsoft 365 business plans. And licenses need a usage location.",
   ops:[N("n2",40,330,"Reset for cloud users → Entra ID P1/P2\nWriteback (hybrid) → P1 + Entra Connect\nLicense needs Usage location","accent")]}
 ],
 takeaways:["SSPR scope: None, Selected (one group) or All.","Choose 1 or 2 required methods; users register methods on sign-in.","Admin accounts always have SSPR with a strong two-method policy and no security questions.","Password writeback (hybrid) needs Entra ID P1 and Entra Connect or Cloud Sync."],
 traps:["\"Selected\" accepts only one group. To pilot with several teams, nest them in one Security group.","Security questions can't be used by administrators."],
 mnemonic:"None, Some (one group), All. Admins: two keys, no quiz.",
 lab:"Turn on SSPR for a pilot group, require one method, sign in as a member, register a method, then reset the password at aka.ms/sspr.",
 ref:"https://learn.microsoft.com/en-us/entra/identity/authentication/tutorial-enable-sspr"};

LESSONS.rbac={id:"rbac",title:"Azure RBAC: roles and scopes",mins:3,
 keywords:["rbac","role based access control","role assignment","owner","contributor","reader","user access administrator","scope","inheritance","security principal","managed identity"],
 scenes:[
  {say:"Azure role-based access control decides who can do what to Azure resources. A role assignment has three parts: who, what role, and where.",
   ops:[T("ra",120,60,[["Part","Example"],["Security principal (who)","User, group, service principal, managed identity"],["Role definition (what)","Contributor"],["Scope (where)","Resource group rg-web"]],"Role assignment")]},
  {say:"Scopes form a hierarchy: management group, subscription, resource group and resource. Assignments are inherited by every level below.",
   ops:[C(),B("mg","mg",30,30,"mg-Contoso","Management group",900,480),B("sub","sub",60,80,"sub-Prod","Subscription",840,410),B("rg","rg",90,130,"rg-web","Resource group",400,330),
        B("vm","cube",150,200,"vm-web1"),B("st","storage",150,310,"stwebdata")]},
  {say:"Give Priya Reader on the subscription, and she can read every resource group and resource inside it.",
   ops:[B("p","user",560,150,"Priya","Reader on sub-Prod",250),H("sub"),P(["p","vm"],"read","ok"),P(["p","st"],"read","ok")]},
  {say:"Assignments are additive. Add Contributor on rg-web, and she can change resources there while staying read-only everywhere else.",
   ops:[SET("p","Priya","Reader + Contributor (rg-web)"),P(["p","vm"],"write","ok")]},
  {say:"Four built-in roles to know cold.",
   ops:[T("br",530,240,[["Role","Can"],["Owner","Everything + assign access"],["Contributor","Everything except assign access"],["Reader","View only"],["User Access Administrator","Assign access only"]])]},
  {say:"Contributor can't grant access to others. That needs Owner, User Access Administrator, or Role Based Access Control Administrator.",
   ops:[R("br",2,"bad")]},
  {say:"Exam tip: if someone can see a resource but can't change it, check the scope of their assignment before the role itself.",
   ops:[...D("br"),N("n1",530,280,"Can't do it? Check the scope:\nMG → subscription → RG → resource","accent")]}
 ],
 takeaways:["Role assignment = security principal + role definition + scope.","Scopes: management group > subscription > resource group > resource. Assignments inherit downward.","RBAC is additive: effective permissions are the union of all assignments.","Owner = full + access; Contributor = full except access; Reader = view; User Access Administrator = access only."],
 traps:["Contributor can't assign roles or remove resource locks.","Assigning at a lower scope never removes permissions granted at a higher scope."],
 mnemonic:"Who · What · Where, and it flows downhill.",
 lab:"Assign a test user Reader on a subscription and Contributor on one resource group. Sign in as them and try to create a resource in each place.",
 ref:"https://learn.microsoft.com/en-us/azure/role-based-access-control/overview"};

LESSONS.roles={id:"roles",title:"Entra roles vs Azure roles",mins:2,
 keywords:["entra roles","azure ad roles","global administrator","user administrator","billing administrator","azure roles","elevate access","root scope","administrative unit","role confusion"],
 scenes:[
  {say:"Azure has two separate role systems, and mixing them up costs exam points.",
   ops:[B("L","tenant",40,40,"Microsoft Entra roles","identity",420,460),B("Rr","sub",500,40,"Azure roles (RBAC)","resources",420,460)]},
  {say:"Entra roles manage identity: users, groups, licenses and app registrations. Examples are Global Administrator, User Administrator, and Billing Administrator.",
   ops:[B("ga","role",80,110,"Global Administrator","",280),B("ua","role",80,190,"User Administrator","",280),B("ba","role",80,270,"Billing Administrator","",280)]},
  {say:"Azure roles manage resources like VMs, storage and networks. Examples are Owner, Contributor, and Virtual Machine Contributor.",
   ops:[B("ow","role",540,110,"Owner","",280),B("co","role",540,190,"Contributor","",280),B("vc","role",540,270,"Virtual Machine Contributor","",300)]},
  {say:"By default, a Global Administrator has no access to Azure resources. They can elevate access to become User Access Administrator at the root scope, then assign roles.",
   ops:[P(["ga","ow"],"","bad",true),N("n1",60,360,"Global Admin → Entra ID Properties →\nAccess management for Azure resources: Yes\n= User Access Administrator at root (/)","accent")]},
  {say:"Entra roles are scoped to the whole tenant or to an administrative unit.",
   ops:[...D("n1"),N("n2",60,370,"Entra role scope:\ntenant or administrative unit","accent")]},
  {say:"Azure roles are scoped to a management group, subscription, resource group or resource.",
   ops:[N("n3",540,370,"Azure role scope:\nMG · subscription · RG · resource","accent")]},
  {say:"Exam pattern: to create users, you need an Entra role like User Administrator. To create virtual machines, you need an Azure role like Contributor.",
   ops:[H("ua"),H("co")]}
 ],
 takeaways:["Entra roles = identity objects (users, groups, licenses, apps). Azure roles = Azure resources.","Global Administrator has no Azure resource access by default; they can elevate to User Access Administrator at root (/).","Entra roles scope to tenant or administrative unit; Azure roles to MG, subscription, RG or resource."],
 traps:["\"Owner of the subscription\" can't create Entra users unless they also hold an Entra role.","User Administrator can reset passwords for non-admin users but can't manage Azure resources."],
 mnemonic:"Entra = People. Azure RBAC = Things.",
 lab:"As a Global Administrator, open Entra ID > Properties and find \"Access management for Azure resources\". Read it, but leave it off unless you need it.",
 ref:"https://learn.microsoft.com/en-us/azure/role-based-access-control/rbac-and-directory-admin-roles"};

LESSONS.access={id:"access",title:"Interpreting access & custom roles",mins:2,
 keywords:["access control","iam","check access","role assignments","inherited","custom role","actions","notactions","dataactions","assignablescopes","deny assignment"],
 scenes:[
  {say:"To see who can do what, open Access control, or IAM, on any scope. The Role assignments tab shows direct and inherited assignments.",
   ops:[T("iam",80,60,[["Name","Role","Scope"],["Priya Shah","Reader","Subscription (Inherited)"],["sg-WebOps","Contributor","This resource group"],["app-deploy","Website Contributor","This resource"]],"rg-web · Access control (IAM)")]},
  {say:"Check access shows one person's effective roles, including the ones they get through group membership.",
   ops:[B("u","user",80,300,"Priya Shah"),B("g","users",360,300,"sg-WebOps","group"),B("ck","role",640,300,"Check access","Reader + Contributor",230),L("l1","u","g","member","dash"),P(["u","g","ck"],"","ok")]},
  {say:"When no built-in role fits, create a custom role. Its definition lists Actions allowed, NotActions removed, data actions, and the scopes where it can be assigned.",
   ops:[C(),T("cr",80,50,[["Property","Example"],["Actions","Microsoft.Compute/virtualMachines/*"],["NotActions","Microsoft.Compute/virtualMachines/delete"],["DataActions","(none)"],["AssignableScopes","/subscriptions/1111-…"]],"Custom role: VM Operator")]},
  {say:"NotActions isn't a deny. It just removes permissions from this role. If another role grants delete, the user can still delete.",
   ops:[R("cr",2,"bad"),N("n1",80,260,"Effective = Actions − NotActions\nAnother role can still grant it back","bad")]},
  {say:"A real deny comes from deny assignments, which Azure creates for things like managed applications. Deny assignments beat role assignments.",
   ops:[N("n2",80,350,"Deny assignment > any role assignment","accent")]},
  {say:"Exam tip: a star in Actions grants every operation under that path, and AssignableScopes controls where the role can be used.",
   ops:[...D("n1","n2"),N("n3",80,260,"\"*\" = every operation under that path\nAssignableScopes = where it can be assigned","ok")]}
 ],
 takeaways:["IAM > Role assignments shows direct and inherited assignments at a scope.","Check access shows a principal's effective roles, including via groups.","Custom role JSON: Actions, NotActions, DataActions, NotDataActions, AssignableScopes.","NotActions subtracts; it isn't a deny. Deny assignments are the only true deny."],
 traps:["Management-plane Actions (like reading a storage account) don't grant data access (reading blobs). That needs DataActions, e.g. Storage Blob Data Reader.","You can't assign a custom role outside its AssignableScopes."],
 mnemonic:"Actions add, NotActions subtract, only Deny denies.",
 lab:"Export the JSON of the built-in Virtual Machine Contributor role and read its Actions. Then clone it as a custom role that can't delete VMs.",
 ref:"https://learn.microsoft.com/en-us/azure/role-based-access-control/custom-roles"};

LESSONS.hierarchy={id:"hierarchy",title:"Management groups & subscriptions",mins:2,
 keywords:["management group","root management group","subscription","hierarchy","tenant root group","move subscription","change directory","billing","inheritance"],
 scenes:[
  {say:"Azure organizes resources in four levels: management groups, subscriptions, resource groups and resources.",
   ops:[B("root","mgmt",380,30,"Tenant Root Group","",200),B("mg1","mgmt",150,140,"mg-Corp"),B("mg2","mgmt",610,140,"mg-Sandbox"),B("s1","key",60,250,"sub-Prod"),B("s2","key",260,250,"sub-Dev"),B("s3","key",610,250,"sub-Lab"),
        B("rg","folder",60,360,"rg-web"),B("res","cube",60,460,"vm-web1"),L("a1","root","mg1"),L("a2","root","mg2"),L("a3","mg1","s1"),L("l5","mg1","s2"),L("a4","mg2","s3"),L("a5","s1","rg"),L("a6","rg","res")]},
  {say:"Each tenant has one root management group. You can nest management groups up to six levels deep, not counting the root or the subscription level.",
   ops:[N("n1",630,360,"Depth: up to 6 levels\n(excluding root and subscription)\nEach MG or subscription: ONE parent","accent")]},
  {say:"A policy or role assigned at mg-Corp flows down to every subscription, resource group and resource beneath it.",
   ops:[B("pol","policy",360,140,"Allowed locations","policy",210),L("lp","pol","mg1","assigned","ok"),P(["mg1","s1","rg","res"],"inherits","ok")]},
  {say:"Subscriptions are billing and access boundaries. Each subscription trusts exactly one Entra tenant.",
   ops:[...D("n1"),N("n2",630,360,"Subscription = billing + access boundary\nTrusts exactly one Entra tenant","accent")]},
  {say:"Moving a subscription to another management group needs permission on the subscription and on both the old and new parent groups.",
   ops:[...D("l5","n2"),MV("s2",800,250),L("a7","mg2","s2"),N("n3",630,370,"Move subscription: Owner on sub +\nwrite on old and new parent MG","accent")]},
  {say:"Changing a subscription's Entra directory is different: all existing role assignments are removed, so plan to recreate them.",
   ops:[...D("n2","n3"),N("n4",630,370,"Change directory (tenant) →\nall RBAC role assignments removed","bad")]}
 ],
 takeaways:["Hierarchy: management groups > subscriptions > resource groups > resources.","One root management group per tenant; up to 6 levels of MGs below it.","Each MG or subscription has exactly one parent.","Assignments (RBAC, Policy) at a management group inherit to everything below.","Transferring a subscription to another tenant removes its RBAC role assignments."],
 traps:["Management groups organize subscriptions; they don't hold resources directly.","Moving a subscription between MGs changes which policies and roles it inherits."],
 mnemonic:"Root at the top, six floors max, one parent each.",
 lab:"Create two management groups under the root, move a test subscription between them, and watch the inherited policy assignments change.",
 ref:"https://learn.microsoft.com/en-us/azure/governance/management-groups/overview"};

LESSONS.policy={id:"policy",title:"Azure Policy",mins:3,
 keywords:["azure policy","policy definition","initiative","assignment","effect","deny","audit","modify","deployifnotexists","remediation","compliance","allowed locations","exclusion"],
 scenes:[
  {say:"Azure Policy enforces rules on resource properties, like allowed regions or required tags. RBAC controls who can act. Policy controls what they can create.",
   ops:[B("u","user",40,230,"Dev","Contributor"),B("arm","app",300,230,"Resource Manager","",210),B("pd","policy",620,110,"Allowed locations","East US, West Europe",250),L("l1","pd","arm","evaluates","dash")]},
  {say:"Dev tries to create a VM in Japan East. He has permission, but the policy denies the request.",
   ops:[B("vm","cube",640,340,"vm-tokyo","Japan East",210),P(["u","arm","vm"],"create","bad",true)]},
  {say:"A definition is one rule. An initiative groups several definitions. An assignment applies either one to a scope, with optional exclusions and parameters.",
   ops:[C(),T("pt",60,60,[["Object","What it is"],["Definition","One rule + effect (JSON)"],["Initiative","A set of definitions"],["Assignment","Definition/initiative → scope"],["Exclusion","Child scope skipped"]],"Policy building blocks")]},
  {say:"The effect decides what happens to a resource that doesn't comply.",
   ops:[T("ef",450,60,[["Effect","What it does"],["Deny","Blocks non-compliant create/update"],["Audit","Allows, but flags non-compliant"],["Append / Modify","Adds or changes properties (tags)"],["DeployIfNotExists","Deploys a related resource if missing"],["AuditIfNotExists","Flags if a related resource is missing"]],"Effects")]},
  {say:"Assigning a Deny policy doesn't delete or fix existing resources. They're simply reported as non-compliant.",
   ops:[R("ef",1,"accent"),N("n1",60,300,"Existing resources: marked non-compliant,\nnot deleted or changed","bad")]},
  {say:"To fix existing resources with Modify or DeployIfNotExists, run a remediation task. It uses the managed identity created with the assignment.",
   ops:[R("ef",4,"ok"),...D("n1"),N("n2",60,300,"Remediation task → fixes existing resources\n(Modify, DeployIfNotExists)\nuses the assignment's managed identity","ok")]},
  {say:"A new assignment can take about thirty minutes to start applying, so don't panic if a test resource slips through right away.",
   ops:[...D("n2"),N("n3",60,300,"New assignment → effective in ~30 minutes","accent")]}
 ],
 takeaways:["Definition (rule + effect) → Initiative (group) → Assignment (scope + parameters + exclusions).","Effects: Deny, Audit, Append, Modify, DeployIfNotExists, AuditIfNotExists, Disabled.","Deny stops new non-compliant resources; existing ones are only flagged.","Remediation tasks fix existing resources for Modify and DeployIfNotExists using a managed identity.","RBAC = who can act. Policy = what's allowed."],
 traps:["Policy applies even to Owners. Being Owner doesn't bypass a Deny policy; use an exclusion or exemption.","Built-in \"Require a tag\" denies resources without the tag; it doesn't add the tag. Adding tags is Modify."],
 mnemonic:"Deny blocks, Audit watches, Modify fixes, DINE deploys.",
 lab:"Assign the built-in \"Allowed locations\" policy to a resource group with only one region, wait ~30 minutes, then try to create a resource in another region.",
 ref:"https://learn.microsoft.com/en-us/azure/governance/policy/overview"};

   ops:[B("rg","rg",40,60,"rg-prod","Resource group",460,420),B("vm","cube",80,150,"vm-db1"),B("st","storage",80,270,"stprod"),B("lk","lock",290,150,"CanNotDelete","on rg-prod",180)]},
  {say:"CanNotDelete lets people read and modify, but not delete. ReadOnly allows reads only, as if everyone had Reader.",
   ops:[T("lt",540,60,[["Lock","Read","Modify","Delete"],["CanNotDelete","✓","✓","✗"],["ReadOnly","✓","✗","✗"]])]},
  {say:"Locks are inherited. A lock on the resource group protects every resource in it, and the most restrictive lock wins.",
   ops:[P(["lk","vm"],"inherited","ok"),P(["lk","st"],"inherited","ok")]},
  {say:"ReadOnly has surprises. On a storage account, it blocks listing keys, because that's a POST operation. On a VM, it blocks start and restart.",
   ops:[SET("lk","ReadOnly","on rg-prod"),R("lt",2,"bad"),N("n1",540,200,"ReadOnly blocks POST actions:\n• list storage account keys\n• start / restart a VM","bad")]},
  {say:"To delete a locked resource, remove the lock first. That needs Owner or User Access Administrator. Contributors can't remove locks.",
   ops:[...D("n1"),N("n2",540,200,"Remove lock: Microsoft.Authorization/locks/*\n→ Owner or User Access Administrator","accent")]},
  {say:"Tags are name and value pairs for organizing resources and costs, like Environment equals Production.",
   ops:[C(),B("rg","rg",40,60,"rg-prod","tags: Env=Prod",460,420),B("vm","cube",80,150,"vm-db1","no tags"),B("st","storage",80,270,"stprod","no tags"),B("tg","tag",290,150,"Env = Prod","CostCenter = 4410",180)]},
  {say:"Tags aren't inherited. Resources in a tagged resource group get nothing, unless you use a policy like Inherit a tag from the resource group.",
   ops:[N("n3",540,110,"Tags don't inherit by default.\nPolicy: \"Inherit a tag from the\nresource group if missing\" (Modify)","accent"),P(["tg","vm"],"policy","ok"),SET("vm","vm-db1","Env=Prod"),SET("st","stprod","Env=Prod")]},
  {say:"Limits: up to fifty tag pairs per resource. Tag names aren't case-sensitive, but tag values are.",
   ops:[...D("n3"),N("n4",540,110,"Max 50 tags per resource\nNames: case-insensitive\nValues: case-sensitive","ok")]}
 ],
 takeaways:["CanNotDelete: read + modify, no delete. ReadOnly: read only.","Locks inherit from subscription and resource group; the most restrictive applies.","ReadOnly blocks POST operations such as listing storage keys or starting VMs.","Removing a lock needs Microsoft.Authorization/locks/* (Owner, User Access Administrator).","Tags don't inherit by default; use the Modify-based \"Inherit a tag\" policies."],
 traps:["A CanNotDelete lock on a resource group blocks deleting the group, and every resource inside it.","Applying tags to a resource group doesn't tag existing resources in it."],
 mnemonic:"CanNotDelete = 'touch but don't throw away'. ReadOnly = 'look, don't touch'.",
 lab:"Put a ReadOnly lock on a resource group containing a storage account, then try to view its access keys. Swap it for CanNotDelete and try again.",
 ref:"https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources"};

LESSONS.move={id:"move",title:"Resource groups & moving resources",mins:2,
 keywords:["resource group","move resources","move to another subscription","resource id","dependent resources","delete resource group","resource group location"],
 scenes:[
  {say:"A resource group is a logical container. Its location only stores metadata. The resources inside can live in any region.",
   ops:[B("rg","rg",40,60,"rg-app","East US (metadata)",440,420),B("a","cube",80,150,"vm-app1","East US"),B("b","storage",80,250,"stapp","West Europe"),B("c","sql",80,350,"sql-app","Central India")]},
  {say:"Delete a resource group and everything in it is deleted too. Great for cleaning up labs, dangerous in production.",
   ops:[M("a","bad"),M("b","bad"),M("c","bad"),N("n1",520,80,"Delete RG = delete every resource inside","bad")]},
  {say:"You can move resources to another resource group or subscription. The resource keeps running, but its resource ID changes, so update scripts and links.",
   ops:[M("a"),M("b"),M("c"),...D("n1"),B("rg2","rg",520,60,"rg-app2","Resource group",400,420),MV("b",570,150),N("n2",560,280,"Resource ID changes:\n/resourceGroups/rg-app2/…","accent")]},
  {say:"During a move, both resource groups are locked for create, update and delete operations. The resources stay online.",
   ops:[...D("n2"),N("n3",560,280,"During the move: source + target\nRG locked for create/update/delete","accent")]},
  {say:"Dependent resources must move together, such as a VM with its disks and network interface. Not every resource type can move, so the portal validates first.",
   ops:[C(),B("gr","group",50,60,"Move together","",260,330),B("vm","cube",80,110,"vm-app1"),B("dk","storage",80,200,"disk-os","managed disk"),B("nic","app",80,290,"nic-app1","network interface",180),N("n4",380,100,"Validate first: the portal checks\nmove support and dependencies","accent")]},
  {say:"Moving to another subscription requires both subscriptions in the same Entra tenant, and the resource provider registered in the target.",
   ops:[N("n5",380,220,"Cross-subscription move:\n• same Entra tenant\n• resource provider registered in target\n• permissions on source and target","accent")]},
  {say:"Role and policy assignments inherited from the old resource group stop applying. The new location's assignments take over.",
   ops:[...D("n4","n5"),N("n6",380,160,"Inherited RBAC + policy follow the NEW\nscope, not the old one","bad")]}
 ],
 takeaways:["Resource group location stores metadata only; resources can be in any region.","Deleting a resource group deletes everything in it.","Moving changes the resource ID but not the region; the resource stays online.","Source and target groups are locked for writes during a move.","Cross-subscription moves need the same tenant and the provider registered in the target."],
 traps:["A move doesn't change a resource's region. Changing regions is Azure Resource Mover or redeploy.","Not all resource types support moves. Check the move support table."],
 mnemonic:"Move = new address (ID), same city (region).",
 lab:"Create a storage account in rg-a, move it to rg-b, and compare the resource ID before and after.",
 ref:"https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/move-resource-group-and-subscription"};

Object.assign(CASES,{northwind:{title:"Northwind Traders",text:"Northwind has one Entra tenant and three subscriptions: sub-Prod, sub-Dev and sub-Finance. All three sit under a management group mg-Northwind.\n\n• The IT team (group sg-IT) manages all Azure resources.\n• Auditors (group sg-Audit) must view everything but change nothing.\n• Resources in sub-Prod must be created only in Central India or South India.\n• Every resource must have a CostCenter tag. If missing, it should be copied from the resource group.\n• Finance wants an email when sub-Finance is forecast to exceed ₹ 5,00,000 in a month.\n• The production database resource group rg-proddb must never be deleted by accident.\n• Sales staff should automatically get the Sales app license when their department is set to Sales."}});

LESSONS.arm={id:"arm",title:"ARM templates",mins:3,
 keywords:["arm","arm template","json template","resource manager","parameters","variables","outputs","dependson","template functions","export template","parameter file","az deployment"],
 scenes:[
  {say:"An ARM template is a JSON file that declares the Azure resources you want. Resource Manager reads it and makes Azure match it.",
   ops:[B("tp","app",50,220,"main.json","ARM template"),B("arm","app",330,220,"Resource Manager","",200),B("rg","rg",620,70,"rg-web","Resource group",300,400),
        B("vm","cube",665,140,"vm-web1"),B("st","storage",665,250,"stweb01"),B("ip","ip",665,360,"pip-web1"),P(["tp","arm","vm"],"","ok"),P(["arm","st"],"","ok")]},
  {say:"A template has a few sections, and only resources is required.",
   ops:[C(),T("sec",60,60,[["Section","Purpose"],["$schema, contentVersion","Template format and your version"],["parameters","Values supplied at deploy time"],["variables","Reusable values computed inside"],["resources","What to deploy (required)"],["outputs","Values returned after deployment"]],"Template sections")]},
  {say:"Expressions in square brackets call template functions. Here the name comes from a parameter and the location from the resource group.",
   ops:[R("sec",1,"accent"),T("ex",60,290,[["Expressions"],["\"name\": \"[parameters('vmName')]\""],["\"location\": \"[resourceGroup().location]\""],["\"sku\": \"[variables('skuName')]\""]])]},
  {say:"dependsOn controls the order. A VM depends on its network interface, which depends on the virtual network.",
   ops:[C(),B("vn","route",60,200,"vnet-web","deployed 1st"),B("nic","app",350,200,"nic-web1","2nd · dependsOn vnet",230),B("vm","vm",690,200,"vm-web1","3rd · dependsOn nic",220),
        L("d1","nic","vn","dependsOn","dash"),L("d2","vm","nic","dependsOn","dash")]},
  {say:"Put values in a parameter file, so one template can deploy both dev and prod.",
   ops:[B("pd","app",200,360,"dev.parameters.json","vmSize: B2s",230),B("pp","app",520,360,"prod.parameters.json","vmSize: D4s_v5",230)]},
  {say:"Deploy with the Azure CLI or PowerShell, at resource group, subscription, management group or tenant scope.",
   ops:[C(),T("cmd",60,60,[["Scope","Azure CLI","PowerShell"],["Resource group","az deployment group create","New-AzResourceGroupDeployment"],["Subscription","az deployment sub create","New-AzSubscriptionDeployment"],["Management group","az deployment mg create","New-AzManagementGroupDeployment"],["Tenant","az deployment tenant create","New-AzTenantDeployment"]],"Deployment commands")]},
  {say:"Don't have a template? Export one from a resource group, a resource, or deployment history. Clean it up, then reuse it.",
   ops:[N("n1",60,300,"Export template: resource group · resource · deployment history\nthen parameterize names, locations and sizes","ok")]}
 ],
 takeaways:["Template sections: $schema, contentVersion, parameters, variables, resources (required), outputs.","Expressions use functions in brackets: parameters(), variables(), resourceGroup().location, resourceId().","dependsOn sets deployment order.","Parameter files let one template serve many environments.","az deployment group|sub|mg|tenant create, or the matching New-Az…Deployment cmdlets."],
 traps:["To deploy a resource group itself, deploy at subscription scope (az deployment sub create).","Hard-coded locations and names make templates fail elsewhere. Use parameters and resourceGroup().location."],
 mnemonic:"P-V-R-O: Parameters in, Variables inside, Resources built, Outputs out.",
 lab:"Export the template of a resource group with a storage account, change the account name to a parameter, and redeploy it to a new resource group with az deployment group create.",
 ref:"https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/overview"};

LESSONS.bicep={id:"bicep",title:"Bicep & deployment modes",mins:2,
 keywords:["bicep","decompile","bicep build","deployment mode","incremental","complete mode","what-if","template spec","module"],
 scenes:[
  {say:"Bicep is a simpler language for the same job. It compiles to an ARM template, so anything ARM can deploy, Bicep can too.",
   ops:[B("bc","app",60,200,"main.bicep","Bicep"),B("js","app",390,200,"main.json","ARM template"),B("arm","app",720,200,"Resource Manager","",200),L("l1","bc","js","az bicep build","dash"),L("l2","js","arm","deploy","ok"),P(["bc","js","arm"],"","ok")]},
  {say:"Going the other way, az bicep decompile turns an existing ARM template into Bicep.",
   ops:[P(["js","bc"],"decompile","signal")]},
  {say:"Here's how the two compare.",
   ops:[C(),T("cmp",60,60,[["","ARM JSON","Bicep"],["Syntax","Verbose JSON","Concise, readable"],["Parameter","\"parameters\": { … }","param vmName string"],["Reference","[parameters('vmName')]","vmName"],["Dependencies","dependsOn, written by hand","Mostly automatic"],["Reuse","Linked templates","module keyword"]],"ARM vs Bicep")]},
  {say:"Deployment mode matters. Incremental, the default, adds and updates resources in the template and leaves everything else alone.",
   ops:[C(),B("rg","rg",40,60,"rg-app","Resource group",400,420),B("a","cube",80,140,"vm-a","in template"),B("b","storage",80,240,"st-b","in template"),B("o","cube",80,340,"vm-old","not in template"),
        B("tp","app",620,140,"main.bicep","vm-a, st-b"),P(["tp","a"],"","ok"),P(["tp","b"],"","ok"),N("n1",500,260,"Incremental (default): vm-old is kept","ok")]},
  {say:"Complete mode deletes every resource in the resource group that isn't in the template. Here, vm-old would be deleted.",
   ops:[...D("n1"),M("o","bad"),SET("o","vm-old","deleted"),N("n2",500,260,"Complete: not in template → deleted","bad")]},
  {say:"Before deploying, run what-if to preview what will be created, changed and deleted.",
   ops:[N("n3",500,340,"az deployment group what-if …\n+ create   ~ modify   − delete","accent")]}
 ],
 takeaways:["Bicep compiles to ARM JSON (az bicep build); az bicep decompile converts ARM to Bicep.","Bicep handles most dependencies automatically and uses modules for reuse.","Incremental (default) leaves unlisted resources; Complete deletes them.","Complete mode applies only to resource group deployments.","what-if previews changes before you deploy."],
 traps:["Deploying a template with only one resource in Complete mode deletes everything else in that resource group.","Bicep files are deployed with the same az deployment / New-Az…Deployment commands as ARM templates."],
 mnemonic:"Incremental adds. Complete cleans house.",
 lab:"Write a Bicep file that creates one storage account. Deploy it with --what-if, then deploy for real, then decompile an exported ARM template to Bicep.",
 ref:"https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/overview"};

LESSONS.vmcreate={id:"vmcreate",title:"Creating & resizing VMs",mins:2,
 keywords:["virtual machine","vm","vm size","resize","deallocate","stopped","b series","d series","e series","spot vm","auto-shutdown"],
 scenes:[
  {say:"Creating a VM means choosing a region, image, size, disks, network and an admin login.",
   ops:[T("cr",60,60,[["Tab","Key choices"],["Basics","Region, availability, image, size, admin account"],["Disks","OS disk type, data disks, encryption"],["Networking","VNet, subnet, public IP, NSG"],["Management","Auto-shutdown, backup, identity"],["Monitoring","Boot diagnostics, insights"]],"Create a virtual machine")]},
  {say:"Sizes come in families. Pick the family that matches the workload.",
   ops:[C(),T("fam",60,60,[["Series","Best for"],["B","Burstable, low-cost dev/test"],["D","General purpose"],["E","Memory-optimized (databases)"],["F","Compute-optimized"],["L","Storage-optimized"],["N","GPU workloads"]],"VM size families")]},
  {say:"You can resize a VM later. If the new size is available on the current hardware cluster, you resize while it runs, and it restarts.",
   ops:[B("vm","vm",440,80,"vm-app1","D2s_v5 → D4s_v5",240),N("n1",440,170,"Resize = restart. Plan for downtime.","accent")]},
  {say:"If the size you want isn't listed, deallocate the VM first. Then every size in the region becomes available.",
   ops:[SET("vm","vm-app1","Stopped (deallocated)"),N("n2",440,240,"Size not listed? Stop (deallocate) → resize","accent")]},
  {say:"Shutting down inside the guest OS isn't deallocating. You keep paying for compute until you stop the VM from Azure.",
   ops:[T("st",440,310,[["VM state","Compute billed?"],["Running","Yes"],["Stopped (from inside the OS)","Yes"],["Stopped (deallocated)","No"]])]},
  {say:"Auto-shutdown and Spot VMs cut costs for dev and test. Reserved instances and savings plans cut them for steady workloads.",
   ops:[N("n3",60,330,"Save: auto-shutdown · Spot VMs\nReservations / savings plans","ok")]}
 ],
 takeaways:["Families: B burstable, D general, E memory, F compute, L storage, N GPU.","Resizing restarts the VM. If the size isn't offered, deallocate first.","Stopped from the OS still bills compute; Stopped (deallocated) doesn't.","Spot VMs are cheap but can be evicted at any time."],
 traps:["\"Stop the VM to save cost\" means deallocate from Azure, not shut down the OS.","Deallocating releases a dynamic public IP and wipes the temporary disk."],
 mnemonic:"B for Budget, D for Default, E for Extra memory, F for Fast CPU, N for Nvidia.",
 lab:"Create a B-series VM with auto-shutdown at 7 PM. Resize it to a D-series size while running, then stop it from the portal and check the status says deallocated.",
 ref:"https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/overview"};

LESSONS.disks={id:"disks",title:"Managed disks",mins:3,
 keywords:["managed disk","os disk","data disk","temporary disk","premium ssd","standard ssd","standard hdd","ultra disk","premium ssd v2","snapshot","disk resize","attach disk"],
 scenes:[
  {say:"Every VM has an OS disk and usually a temporary disk. You add data disks for applications and databases.",
   ops:[B("vm","vm",380,40,"vm-db1","",200),B("os","storage",60,220,"OS disk","C: · persistent",200),B("tmp","storage",380,220,"Temporary disk","D: · not persistent",200),B("dd","storage",700,220,"Data disk","F: · persistent",200),
        L("l1","vm","os"),L("l2","vm","tmp"),L("l3","vm","dd")]},
  {say:"The temporary disk is wiped when the VM is deallocated or moved to a new host. Never keep data you need there.",
   ops:[M("tmp","bad"),N("n1",280,330,"Temporary disk: wiped on deallocate or redeploy","bad")]},
  {say:"Managed disk types, from cheapest to fastest.",
   ops:[C(),T("dt",60,60,[["Type","Typical use","OS disk?"],["Standard HDD","Backups, infrequent access","Yes"],["Standard SSD","Web servers, light dev/test","Yes"],["Premium SSD","Production, databases","Yes"],["Premium SSD v2","High IOPS, tunable performance","No"],["Ultra Disk","Highest IOPS, SAP HANA, top-tier DBs","No"]],"Managed disk types")]},
  {say:"You can increase a disk's size but never shrink it. Changing a disk's type, like Standard to Premium, needs the VM deallocated.",
   ops:[N("n2",60,300,"Size: increase only, never shrink\nChange type: deallocate the VM first","accent")]},
  {say:"Snapshots are point-in-time copies of a disk, full or incremental. Create a new disk from a snapshot to restore or clone.",
   ops:[B("d1","storage",560,300,"disk-data",""),B("sn","storage",760,300,"snap-0601","incremental",170),L("ls","d1","sn","snapshot","dash")]},
  {say:"Data disks can be attached or detached while the VM runs. How many you can attach depends on the VM size.",
   ops:[N("n3",60,400,"Attach / detach data disks while running ✓\nMax number of data disks = set by VM size","ok")]}
 ],
 takeaways:["OS disk and data disks are persistent managed disks; the temporary disk is not.","Types: Standard HDD < Standard SSD < Premium SSD < Premium SSD v2 < Ultra.","Premium SSD v2 and Ultra Disk can't be OS disks.","Disks can grow, never shrink. Changing type needs the VM deallocated.","Snapshots (full or incremental) can create new disks."],
 traps:["Data on the temporary (D:) disk is lost after deallocation, resize to another host, or redeploy.","Premium SSD needs a VM size that supports premium storage (sizes with an 's', like D4s_v5)."],
 mnemonic:"Temp disk = whiteboard: wiped when you leave the room.",
 lab:"Attach a new 32 GiB Standard SSD data disk to a running VM, initialize it in the OS, then take an incremental snapshot and create a disk from it.",
 ref:"https://learn.microsoft.com/en-us/azure/virtual-machines/managed-disks-overview"};

LESSONS.encrypt={id:"encrypt",title:"VM disk encryption",mins:2,
 keywords:["encryption","server-side encryption","sse","encryption at host","azure disk encryption","ade","bitlocker","dm-crypt","disk encryption set","customer-managed key","key vault"],
 scenes:[
  {say:"Every managed disk is encrypted at rest by default, using server-side encryption with platform-managed keys. Nothing to configure.",
   ops:[B("vm","vm",60,200,"vm-app1"),B("dk","storage",380,200,"disk-os","SSE · platform key",190),L("l1","vm","dk"),N("n1",60,330,"Default: SSE with platform-managed keys","ok")]},
  {say:"Want to control the keys? Use customer-managed keys in Key Vault, linked to disks through a disk encryption set.",
   ops:[B("kv","key",700,60,"Key Vault","your key",200),B("des","lock",700,200,"Disk encryption set","",220),L("l2","kv","des","key","dash"),L("l3","des","dk","customer-managed key","ok"),SET("dk","disk-os","SSE · customer key")]},
  {say:"Encryption at host goes further. Temp disks and caches are encrypted on the host itself. Register the feature on the subscription first.",
   ops:[...D("n1"),N("n2",60,330,"Encryption at host: also temp disk + caches\nRegister: Microsoft.Compute/EncryptionAtHost","accent")]},
  {say:"Azure Disk Encryption encrypts inside the guest with BitLocker or DM-Crypt, keys in Key Vault. Microsoft now recommends encryption at host, as ADE retires in 2028.",
   ops:[...D("n2"),N("n3",60,330,"ADE: BitLocker (Windows) / DM-Crypt (Linux)\nRetiring Sept 2028 → prefer encryption at host","bad")]},
  {say:"For Azure Disk Encryption, the Key Vault must be in the same region and subscription as the VM, with disk encryption access turned on.",
   ops:[...D("n3"),N("n4",60,330,"ADE Key Vault: same region + subscription\nAccess: Azure Disk Encryption for volume encryption","accent")]},
  {say:"Here are the options side by side.",
   ops:[C(),T("cmp",60,80,[["Option","Where it encrypts","Keys"],["Server-side encryption","Storage service (default)","Platform or customer-managed"],["Encryption at host","VM host: disks, temp disk, caches","Platform or customer-managed"],["Azure Disk Encryption","Inside the guest OS","Key Vault (BitLocker/DM-Crypt)"]],"Disk encryption options")]}
 ],
 takeaways:["All managed disks get SSE with platform-managed keys by default.","Customer-managed keys use Key Vault + a disk encryption set.","Encryption at host also covers temp disks and caches; register the subscription feature first.","ADE encrypts in the guest; Key Vault must match region and subscription. Microsoft recommends encryption at host for new VMs."],
 traps:["\"Encrypt the temporary disk\" → encryption at host (or ADE), not SSE alone.","ADE fails if the Key Vault is in another region or doesn't allow disk encryption access."],
 mnemonic:"SSE at rest, Host for the rest, ADE inside the guest.",
 lab:"Register EncryptionAtHost on a test subscription, create a VM with encryption at host enabled, and check the setting on the VM's Disks blade.",
 ref:"https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption-overview"};

Object.assign(CASES,{tailwind:{title:"Tailwind Toys",text:"Tailwind Toys runs an online store in Central India.\n\n• The storefront is a .NET web app. New releases must be tested with 10% of real users before going live, with no downtime.\n• The storefront needs a custom domain shop.tailwindtoys.com with HTTPS, and must read from an Azure SQL database that's reachable only from vnet-data.\n• Order processing runs on VMs that must survive the loss of an entire datacenter.\n• Nightly image-resizing jobs run in containers for about 20 minutes and must stop when finished.\n• Container images are stored in a registry that must be reachable from both Central India and West Europe with low latency.\n• All infrastructure is deployed from Bicep files; a recent deployment unexpectedly deleted a test VM."}});

LESSONS.stacct={id:"stacct",title:"Storage accounts",mins:2,
 keywords:["storage account","general purpose v2","gpv2","premium","account kind","endpoint","hierarchical namespace","data lake","storage account name","secure transfer"],
 scenes:[
  {say:"A storage account is a namespace for your data. One account holds blobs, files, queues and tables, each with its own endpoint.",
   ops:[B("acct","storage",380,40,"stcontoso01","Storage account",200),B("b","app",40,220,"Blob","blob endpoint",170),B("f","app",280,220,"Files","file endpoint",170),B("q","app",520,220,"Queue","queue endpoint",170),B("t","app",760,220,"Table","table endpoint",170),
        L("l1","acct","b"),L("l2","acct","f"),L("l3","acct","q"),L("l4","acct","t")]},
  {say:"Names are global. Three to twenty-four lowercase letters and numbers, unique across Azure, because the name becomes part of the URL.",
   ops:[N("n1",160,340,"https://stcontoso01.blob.core.windows.net\nName: 3–24 chars, lowercase letters + numbers, globally unique","accent")]},
  {say:"Pick the account type. Standard general-purpose v2 fits almost everything. Premium types trade cost for low latency.",
   ops:[C(),T("ty",60,60,[["Account type","Use"],["Standard general-purpose v2","Recommended: blobs, files, queues, tables"],["Premium block blobs","Low-latency blob workloads"],["Premium file shares","High-performance Azure Files (SMB, NFS)"],["Premium page blobs","Page blobs, e.g. unmanaged VM disks"]],"Account types")]},
  {say:"Performance, Standard or Premium, is fixed when you create the account. To change it, create a new account and copy the data.",
   ops:[R("ty",1,"accent"),N("n2",60,300,"Performance (Standard/Premium): fixed at creation","bad")]},
  {say:"Enable hierarchical namespace for Data Lake Storage analytics. It adds real directories and file-level permissions.",
   ops:[N("n3",60,370,"Hierarchical namespace = Data Lake Storage Gen2","accent")]},
  {say:"Other choices at creation: redundancy, default access tier, secure transfer required, minimum TLS version, and whether anonymous blob access is allowed.",
   ops:[...D("n2","n3"),T("op",60,300,[["Setting","Recommended"],["Secure transfer required","Enabled (HTTPS only)"],["Minimum TLS version","1.2"],["Allow anonymous blob access","Disabled"],["Default access tier","Hot or Cool"]],"Advanced settings")]}
 ],
 takeaways:["One storage account serves Blob, Files, Queue and Table, each with its own endpoint.","Names: 3–24 lowercase letters and numbers, globally unique.","Standard general-purpose v2 is the default choice; Premium types are specialized.","Performance tier can't be changed after creation.","Hierarchical namespace enables Data Lake Storage Gen2."],

 mnemonic:"GPv2 = General Purpose, Very likely the answer.",
 lab:"Create a Standard GPv2 account with secure transfer required, TLS 1.2 and anonymous access disabled. Open the Endpoints blade and note the four service URLs.",
