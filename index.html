<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AZ-104 Motion Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky console header; one main column; the stage is a blueprint canvas where packets move. */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --surface2:#E2E8EC; --ink:#0E1B26; --muted:#566874; --line:#C7D1D8;
  --accent:#0A64C2; --accent-soft:#D9E8F8; --signal:#D98A1C; --ok:#178A5E; --ok-soft:#DCF1E7; --bad:#C93A30; --bad-soft:#F8E0DD; --violet:#5B43C9;
  --grid:rgba(10,100,194,.07);
  --f-display:"Archivo",ui-sans-serif,system-ui,sans-serif; --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A131A; --surface:#111D27; --surface2:#172734; --ink:#E3EBF1; --muted:#8C9EAC; --line:#283B4A;
  --accent:#58A8F5; --accent-soft:#16304A; --signal:#F0AE4A; --ok:#3CC48D; --ok-soft:#123528; --bad:#F06A5F; --bad-soft:#3A1A18; --violet:#9C88FF;
  --grid:rgba(88,168,245,.07); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A131A; --surface:#111D27; --surface2:#172734; --ink:#E3EBF1; --muted:#8C9EAC; --line:#283B4A;
  --accent:#58A8F5; --accent-soft:#16304A; --signal:#F0AE4A; --ok:#3CC48D; --ok-soft:#123528; --bad:#F06A5F; --bad-soft:#3A1A18; --violet:#9C88FF;
  --grid:rgba(88,168,245,.07); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;padding-block:10px;flex-wrap:wrap}
.brand{text-align:left;display:flex;align-items:center;gap:10px;font:700 17px/1 var(--f-display);font-stretch:112%;letter-spacing:.01em;cursor:pointer;background:none;border:0;padding:0}
.brand small{font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.04em}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:500;color:var(--muted);cursor:pointer;display:flex;gap:6px;align-items:center}
nav.tabs button:hover{background:var(--surface2);color:var(--ink)}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.badge{font:600 11px var(--f-mono);background:var(--signal);color:#1a1205;border-radius:99px;padding:1px 7px}
main{padding-block:24px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:clamp(26px,4vw,38px);font-weight:750;font-stretch:108%;line-height:1.08;letter-spacing:-.01em}
h2{font-size:20px;font-weight:700;font-stretch:105%}
h3{font-size:16px;font-weight:650}
.eyebrow{font:500 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#04111e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#04111e}}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:13.5px}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 11.5px var(--f-mono);padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:currentColor;background:var(--ok-soft)}
.chip.warn{color:var(--signal);border-color:currentColor}
.chip.bad{color:var(--bad);border-color:currentColor;background:var(--bad-soft)}
.chip.acc{color:var(--accent);border-color:currentColor;background:var(--accent-soft)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:stretch}
.hero-main{display:flex;flex-direction:column;gap:14px;padding:4px 0}
.searchbox{position:relative}
.searchbox input{width:100%;font:16px var(--f-body);padding:15px 16px 15px 46px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.searchbox input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.searchbox svg.mag{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{margin-top:8px;display:flex;flex-direction:column;gap:2px;padding:6px}
.results button{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--surface2)}
.results .gen{border-top:1px dashed var(--line);margin-top:4px;padding-top:12px;color:var(--accent);font-weight:500}
.suggest{display:flex;gap:6px;flex-wrap:wrap}
.suggest button{border:1px dashed var(--line);background:none;border-radius:99px;padding:4px 11px;font-size:13px;color:var(--muted);cursor:pointer}
.suggest button:hover{border-color:var(--accent);color:var(--accent)}
.ready{padding:18px;display:flex;flex-direction:column;gap:12px}
.ready .big{font:750 46px/1 var(--f-display);font-stretch:95%;font-variant-numeric:tabular-nums}
.ready .row{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.sessionbar{margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;flex-wrap:wrap;border-color:var(--accent);background:var(--accent-soft)}
.section{margin-top:34px;display:flex;flex-direction:column;gap:14px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.domains{display:flex;flex-direction:column}
.domain{display:grid;grid-template-columns:minmax(0,1fr) 70px 160px 150px;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.domain:first-child{border-top:0}
.domain .w{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.domain.on{background:linear-gradient(90deg,var(--accent-soft),transparent 70%)}
.domain .nm{font-weight:500}
.group{display:flex;flex-direction:column;gap:10px}
.group h3{font-size:14px;color:var(--muted);font-family:var(--f-body);font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.lcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:118px}
.lcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.lcard .t{font:650 15.5px/1.25 var(--f-display);font-stretch:104%}
.lcard .meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px}
.lcard .thumb{height:4px;border-radius:99px;background:var(--surface2);overflow:hidden}
.lcard .thumb i{display:block;height:100%;background:var(--ok)}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.res a{display:flex;flex-direction:column;gap:4px;padding:14px;text-decoration:none;color:var(--ink)}
.res a:hover{border-color:var(--accent)}
.res a b{font-weight:600}
.res a span{font-size:13.5px;color:var(--muted)}

/* player */
.crumb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.playerhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.stagewrap{overflow:hidden}
.stage{display:block;width:100%;aspect-ratio:16/9;max-width:100%;background-color:var(--surface);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.caption{padding:14px 18px;border-top:1px solid var(--line);min-height:76px;font-size:16.5px;line-height:1.5;display:flex;gap:12px;align-items:flex-start}
.caption .sn{font:500 12px var(--f-mono);color:var(--muted);padding-top:4px;white-space:nowrap}
.controls{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.ctl{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.ctl:hover{border-color:var(--accent)}
.ctl.play{background:var(--accent);border-color:var(--accent);color:#fff}
.segs{display:flex;gap:4px;flex:1;min-width:140px}
.segs button{flex:1;height:8px;border:0;border-radius:99px;background:var(--surface2);cursor:pointer;padding:0;position:relative;overflow:hidden}
.segs button.done{background:var(--accent)}
.segs button.cur::after{content:"";position:absolute;inset:0;background:var(--accent);transform-origin:left;animation:fill var(--d,6s) linear forwards}
.segs button.cur.paused::after{animation-play-state:paused}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.controls select{font:13px var(--f-body);padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.toggle{display:flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer;user-select:none}
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
.notes .panel{padding:16px 18px}
.notes ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.notes .trap li::marker{color:var(--bad)}
.mn{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--surface2);font-size:14px}
.full{grid-column:1/-1}
.ask textarea{width:100%;min-height:64px;font:15px var(--f-body);padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.answer{white-space:pre-wrap;margin-top:10px;font-size:14.5px}

/* stage svg */
.stage text{font-family:var(--f-body)}
.k-vnet rect.box{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:7 5}
.k-subnet rect.box{fill:var(--surface2);stroke:var(--line);stroke-width:1}
.k-group rect.box{fill:none;stroke:var(--signal);stroke-width:1.5;stroke-dasharray:4 4}
.k-tenant rect.box{fill:none;stroke:var(--violet);stroke-width:1.6;stroke-dasharray:7 5}
.k-mg rect.box{fill:none;stroke:var(--accent);stroke-width:1.4}
.k-sub rect.box{fill:none;stroke:var(--signal);stroke-width:1.6}
.k-rg rect.box{fill:var(--surface2);stroke:var(--line);stroke-width:1}
.k-tenant .clbl{fill:var(--violet)} .k-sub .clbl{fill:var(--signal)} .k-rg .clbl{fill:var(--ink);font-size:12.5px}
.node rect.box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.node.mk-bad rect.box{stroke:var(--bad);stroke-width:2;fill:var(--bad-soft)}
.node.mk-ok rect.box{stroke:var(--ok);stroke-width:2}
.lbl{font-weight:600;font-size:13px;fill:var(--ink)}
.sub{font:11px var(--f-mono);fill:var(--muted)}
.clbl{font:700 13px var(--f-display);fill:var(--accent)}
.k-subnet .clbl{fill:var(--ink);font-size:12.5px}
.k-group .clbl{fill:var(--signal)}
.ico{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic-net{stroke:var(--accent)} .ic-sec{stroke:var(--violet)} .ic-cmp{stroke:var(--ink)} .ic-dat{stroke:var(--ok)} .ic-ops{stroke:var(--signal)}
.link{fill:none;stroke:var(--muted);stroke-width:1.6}
.link.peer{stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.link.dash{stroke-dasharray:6 5;stroke:var(--accent)}
.link.ok{stroke:var(--ok);stroke-width:2.2}
.link.bad{stroke:var(--bad);stroke-dasharray:4 4}
.llbl{font:500 11px var(--f-mono);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.note rect{fill:var(--surface);stroke:var(--accent);stroke-width:1.3}
.note.t-bad rect{stroke:var(--bad);fill:var(--bad-soft)}
.note.t-ok rect{stroke:var(--ok);fill:var(--ok-soft)}
.note text{font:500 12.5px var(--f-mono);fill:var(--ink)}
.tbl rect.bg{fill:var(--surface);stroke:var(--line)}
.tbl rect.hd{fill:var(--surface2)}
.tbl text{font-size:12px;fill:var(--ink)}
.tbl text.h{font-weight:600}
.tbl text.ttl{font:600 11px var(--f-mono);fill:var(--muted);letter-spacing:.05em}
.tbl rect.hr{fill:transparent}
.tbl rect.hr.ok{fill:var(--ok-soft);stroke:var(--ok)}
.tbl rect.hr.bad{fill:var(--bad-soft);stroke:var(--bad)}
.tbl rect.hr.accent{fill:var(--accent-soft);stroke:var(--accent)}
.pk circle{stroke:var(--surface);stroke-width:2}
.pk text{font:600 10.5px var(--f-mono);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.pop{transform-box:fill-box;transform-origin:center}
.fade{animation:fadein .5s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.ring{fill:none;stroke:var(--signal);stroke-width:3;animation:ring 1.6s ease-out 2 both}
@keyframes ring{0%{opacity:.9}100%{opacity:0;stroke-width:12}}
@media (prefers-reduced-motion:reduce){.pop,.fade,.ring{animation:none}.segs button.cur::after{animation:none}}

/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.qprog{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:16px}
.qprog button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font:500 11px var(--f-mono);cursor:pointer;padding:0;position:relative}
.qprog button.ans{background:var(--surface2)}
.qprog button.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.qprog button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qprog button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.qprog button.flag::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--signal)}
.qcard{padding:22px;display:flex;flex-direction:column;gap:16px}
.qstem{font-size:16.5px;white-space:pre-wrap}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.series{font-size:13.5px;color:var(--muted);border-left:3px solid var(--signal);padding:6px 12px;background:var(--surface2);border-radius:0 8px 8px 0}
details.case{border:1px solid var(--line);border-radius:9px;background:var(--surface2)}
details.case summary{padding:10px 14px;cursor:pointer;font-weight:600}
details.case div{padding:0 14px 14px;white-space:pre-wrap;font-size:14.5px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .why{display:block;font-size:13.5px;color:var(--muted);margin-top:4px}
.hot{display:flex;flex-direction:column;gap:12px}
.hot label{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,240px);gap:12px;align-items:center}
.hot select{font:14.5px var(--f-body);padding:9px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.hot select.right{border-color:var(--ok)} .hot select.wrong{border-color:var(--bad)}
.order{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.order .col{border:1px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:140px}
.order .item{display:flex;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px}
.order .item span{flex:1;min-width:0}
.order .item button{border:1px solid var(--line);background:var(--surface2);border-radius:6px;width:28px;height:28px;cursor:pointer;padding:0;flex:none}
.order .item.right{border-color:var(--ok)} .order .item.wrong{border-color:var(--bad)}
.fb{padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:14.5px}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb b{display:block;margin-bottom:4px}
.qnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.timer{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
pre.code{font:13px/1.5 var(--f-mono);background:var(--surface2);padding:12px 14px;border-radius:8px;overflow-x:auto;margin:0}

/* results */
.score{display:flex;gap:28px;align-items:center;flex-wrap:wrap;padding:22px}
.score .big{font:800 64px/1 var(--f-display);font-stretch:92%;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:8px;flex:1;min-width:240px}
.bars .r{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:13.5px}
.bars .r span:last-child{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.rev{display:flex;flex-direction:column;gap:10px}
.rev details{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.rev summary{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;cursor:pointer;list-style:none}
.rev summary::-webkit-details-marker{display:none}
.rev .body{padding:0 14px 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:14.5px}

/* flashcards */
.flash{perspective:1200px;max-width:560px;margin:0 auto;width:100%}
.flash .card{position:relative;height:260px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.flash .card.flip{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:28px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.flash .face.back{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent)}
.flash .face p{font:600 20px/1.35 var(--f-display);margin:0}
.flash .face.back p{font:500 17px/1.5 var(--f-body)}
@media (prefers-reduced-motion:reduce){.flash .card{transition:none}}
.center{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}

<main class="wrap" id="main"></main>
<script>
(function(){
/* ===== Content: helpers ===== */
const B=(id,k,x,y,label,sub,w,h)=>({op:"box",id,k,x,y,label,sub,w,h});
const N=(id,x,y,text,tone)=>({op:"note",id,x,y,text,tone});
const T=(id,x,y,rows,title)=>({op:"table",id,x,y,rows,title});
const L=(id,from,to,label,style)=>({op:"link",id,from,to,label,style});
const P=(path,label,tone,blocked)=>({op:"packet",path,label,tone,blocked});
const H=(id)=>({op:"hl",id});
const D=(...ids)=>ids.map(id=>({op:"del",id}));
const C=()=>({op:"clear"});
const SET=(id,label,sub)=>({op:"set",id,label,sub});
const M=(id,tone)=>({op:"mark",id,tone});
const R=(id,row,tone)=>({op:"hlrow",id,row,tone});
const LEARN="https://learn.microsoft.com/en-us/azure/";

const DOMAINS=[
  {id:"identity",name:"Manage Azure identities and governance",weight:"20–25%",built:false},
  {id:"storage",name:"Implement and manage storage",weight:"15–20%",built:false},
  {id:"compute",name:"Deploy and manage Azure compute resources",weight:"20–25%",built:false},
  {id:"network",name:"Implement and manage virtual networking",weight:"15–20%",built:true},
  {id:"monitor",name:"Monitor and maintain Azure resources",weight:"10–15%",built:false}
];

const GROUPS=[
  {id:"g1",name:"Configure and manage virtual networks",lessons:["vnet","peer","pip","udr","nw"]},
  {id:"g2",name:"Configure secure access to virtual networks",lessons:["nsg","asg","bastion","endpoints"]},
  {id:"g3",name:"Configure name resolution and load balancing",lessons:["dns","lb"]}
];

/* ===== Lessons ===== */
const LESSONS={};

LESSONS.vnet={id:"vnet",title:"Virtual networks & subnets",mins:2,
 keywords:["vnet","virtual network","subnet","cidr","address space","reserved ip","ip address","/29","/24"],
 scenes:[
  {say:"A virtual network, or VNet, is your private network in Azure. Each VNet lives in one region and one subscription.",
   ops:[B("v1","vnet",60,50,"vnet-prod","East US",840,450)]},
  {say:"You give it an address space in CIDR notation. Slash sixteen means sixty-five thousand five hundred thirty-six addresses.",
   ops:[SET("v1","vnet-prod","10.0.0.0/16 · East US"),N("n1",560,70,"10.0.0.0/16 = 65,536 addresses","accent")]},
  {say:"Then you carve that space into subnets. Subnets can't overlap, and each one must fit inside the VNet's address space.",
   ops:[...D("n1"),B("s1","subnet",100,110,"snet-web","10.0.1.0/24",370,170),B("s2","subnet",490,110,"snet-app","10.0.2.0/24",370,170)]},
  {say:"Azure reserves five addresses in every subnet: the network address, the default gateway, two for Azure DNS, and the broadcast address.",
   ops:[T("t1",110,300,[["Address","Reserved for"],["10.0.1.0","Network address"],["10.0.1.1","Default gateway"],["10.0.1.2 – .3","Azure DNS mapping"],["10.0.1.255","Broadcast"]],"Reserved in 10.0.1.0/24")]},
  {say:"So a slash twenty-four gives you two hundred fifty-one usable addresses. The smallest subnet is a slash twenty-nine, with only three usable.",
   ops:[N("n2",500,330,"/24 → 256 − 5 = 251 usable\n/29 →   8 − 5 =   3 usable\nFirst VM gets .4","accent"),H("t1")]},
  {say:"Resources in different subnets of the same VNet can talk to each other by default. No routes or peering needed.",
   ops:[...D("t1","n2"),B("vm1","vm",210,175,"vm-web1","10.0.1.4"),B("vm2","vm",600,175,"vm-app1","10.0.2.4"),P(["vm1","vm2"],"","ok")]},
  {say:"You can add another address space to a VNet later. But you can't change a subnet's range while resources are using it.",
   ops:[B("s3","subnet",100,310,"snet-data","10.0.3.0/24",370,160),N("n3",500,340,"Out of room? Add an address space\nto the VNet, e.g. 10.1.0.0/16","accent")]},
  {say:"Remember: a VNet and all its subnets stay in one region. To connect separate VNets, you use peering. That's the next lesson.",
   ops:[H("v1")]}
 ],
 takeaways:["A VNet belongs to one region and one subscription; subnets can't span VNets.","Azure reserves 5 IPs per subnet (.0, .1, .2, .3 and the last). /29 is the smallest IPv4 subnet (3 usable).","Subnets in the same VNet route to each other by default through system routes.","You can add address spaces to a VNet; you can't resize a subnet that has resources in it."],
 traps:["\"How many VMs fit in a /27?\" → 32 − 5 = 27, not 30 or 32.","Address spaces of VNets you plan to peer or connect to on-premises must not overlap. Plan this up front."],
 mnemonic:"Five are taken: Network, Gateway, DNS, DNS, Broadcast → \"No Good Dogs Do Barking.\"",
 lab:"Create vnet-lab (10.10.0.0/16) with subnets web (10.10.1.0/24) and app (10.10.2.0/27). On the subnet blade, note the available-IP count: 251 and 27.",
 ref:LEARN+"virtual-network/virtual-networks-overview"};

LESSONS.peer={id:"peer",title:"VNet peering",mins:2,
 keywords:["peering","vnet peering","global peering","transitive","hub and spoke","gateway transit","use remote gateways","initiated","connected"],
 scenes:[
  {say:"Two VNets can't talk to each other by default, even in the same subscription.",
   ops:[B("A","vnet",40,80,"vnet-hub","10.0.0.0/16",380,240),B("Bv","vnet",540,80,"vnet-spoke1","10.1.0.0/16",380,240),B("a1","vm",155,175,"vm-hub","10.0.0.4"),B("b1","vm",655,175,"vm-spoke1","10.1.0.4"),P(["a1","b1"],"","bad",true)]},
  {say:"VNet peering connects them over Microsoft's backbone with low latency. Traffic stays private. No public internet, and no gateway needed.",
   ops:[L("p1","A","Bv","peering","peer"),P(["a1","b1"],"","ok")]},
  {say:"You must create the peering on both sides. Until both links exist, the status shows Initiated instead of Connected.",
   ops:[T("t1",310,370,[["Link","Status"],["hub → spoke1","Initiated"],["spoke1 → hub","not created"]]),T("t1",310,370,[["Link","Status"],["hub → spoke1","Connected"],["spoke1 → hub","Connected"]])]},
  {say:"The address spaces must not overlap. If both VNets used ten dot zero dot zero dot zero slash sixteen, peering would be refused.",
   ops:[...D("t1"),N("n2",250,380,"10.0.0.0/16 ↔ 10.0.0.0/16 → overlap, peering not allowed","bad")]},
  {say:"Peering works across regions, which is called global peering, and even across subscriptions and Microsoft Entra tenants.",
   ops:[...D("n2"),SET("A","vnet-hub","10.0.0.0/16 · East US"),SET("Bv","vnet-spoke1","10.1.0.0/16 · West Europe"),N("n3",270,380,"Regional or global · cross-subscription · cross-tenant","accent")]},
  {say:"Here's the big exam trap: peering is not transitive. Spoke one and spoke two both peer with the hub, but they still can't reach each other.",
   ops:[C(),B("hub","vnet",300,40,"vnet-hub","10.0.0.0/16",360,170),B("sp1","vnet",40,320,"vnet-spoke1","10.1.0.0/16",300,170),B("sp2","vnet",620,320,"vnet-spoke2","10.2.0.0/16",300,170),
        B("h1","vm",320,110,"vm-hub"),B("x1","vm",115,390,"vm-spoke1"),B("x2","vm",695,390,"vm-spoke2"),L("l1","hub","sp1","peering","peer"),L("l2","hub","sp2","peering","peer"),P(["x1","h1","x2"],"","bad",true)]},
  {say:"To fix it, peer the spokes directly, or route spoke traffic through a firewall or virtual appliance in the hub using user-defined routes.",
   ops:[L("l3","sp1","sp2","direct peering","dash"),P(["x1","x2"],"","ok")]},
  {say:"Hub and spoke with a VPN gateway: enable Allow gateway transit on the hub side, and Use remote gateways on the spoke side. Then spokes share the hub's gateway.",
   ops:[B("gw","gw",490,110,"vpngw-hub","Gateway"),N("n4",250,240,"Hub: Allow gateway transit   ·   Spoke: Use remote gateways","accent")]}
 ],
 takeaways:["Peering is private, low-latency and needs no gateway. It works regionally, globally, across subscriptions and across tenants.","You need a peering link on both VNets. One side alone shows Initiated.","Peered address spaces must not overlap.","Peering is NOT transitive. Spoke-to-spoke needs direct peering or an NVA/firewall in the hub with UDRs.","Gateway transit: Allow gateway transit (hub) plus Use remote gateways (spoke)."],
 traps:["A spoke can't use remote gateways if it already has its own gateway.","\"Allow forwarded traffic\" must be enabled on a spoke to accept traffic that an NVA in the hub forwards."],
 mnemonic:"Peering is a handshake, not a chain: both hands must reach out, and a friend of a friend isn't your friend.",
 lab:"Create two VNets with non-overlapping ranges and a VM in each. Peer them from one side only and check the status (Initiated). Add the reverse peering, then ping VM to VM.",
 ref:LEARN+"virtual-network/virtual-network-peering-overview"};

LESSONS.pip={id:"pip",title:"Public IP addresses",mins:2,
 keywords:["public ip","pip","standard sku","basic sku","static","dynamic","zone redundant","nat gateway","outbound"],
 scenes:[
  {say:"A public IP address lets an Azure resource talk to the internet, and be reached from it.",
   ops:[B("inet","internet",120,40,"Internet"),B("v","vnet",40,250,"vnet-prod","10.0.0.0/16",360,260),B("ip","ip",120,165,"pip-web1","52.170.10.25"),B("vm","vm",60,370,"vm-web1","10.0.1.4"),L("l1","inet","ip"),L("l2","ip","vm")]},
  {say:"Public IPs come in two SKUs. Basic was retired at the end of September twenty twenty-five, so new deployments use Standard.",
   ops:[T("t1",440,50,[["Feature","Basic (retired)","Standard"],["Allocation","Static or dynamic","Static only"],["Inbound","Open by default","Closed until an NSG allows"],["Zones","None","Zone-redundant or zonal"],["Load balancer","Basic LB","Standard LB"]],"Public IP SKUs")]},
  {say:"Standard public IPs are secure by default. Inbound traffic is blocked until a network security group allows it.",
   ops:[P(["inet","ip","vm"],"443","bad",true),B("nsg","nsg",230,370,"nsg-web","allow 443",155),P(["inet","ip","vm"],"443","ok")]},
  {say:"Allocation on Standard is always static. The address is reserved when you create the resource and kept until you delete it.",
   ops:[N("n1",440,270,"Standard = static. The IP never changes\nwhen the VM stops or restarts.","accent")]},
  {say:"You can attach public IPs to a VM's network interface, a load balancer frontend, a NAT gateway, a VPN gateway, Application Gateway, or Azure Bastion.",
   ops:[...D("n1"),N("n2",440,270,"Attach to: NIC · Load balancer frontend · NAT gateway\nVPN gateway · Application Gateway · Bastion","accent")]},
  {say:"Exam tip: SKUs must match. A Standard load balancer needs Standard public IPs, and zone-redundant IPs keep working if one zone fails.",
   ops:[H("t1"),R("t1",4,"accent")]},
  {say:"For outbound-only internet access, attach a NAT gateway to the subnet instead of giving every VM its own public IP.",
   ops:[...D("n2"),N("n3",440,300,"Outbound only? NAT gateway on the subnet:\none static outbound IP, no inbound exposure.","ok")]}
 ],
 takeaways:["Standard SKU: static only, zone-redundant or zonal, closed to inbound until an NSG allows it.","Basic public IPs were retired on 30 September 2025. Expect Standard in every current scenario.","Public IP and load balancer SKUs must match.","Use a NAT gateway for scalable outbound connectivity without inbound exposure."],
 traps:["If a VM with a Standard public IP can't be reached, the usual cause is a missing NSG allow rule.","A public IP must be in the same region as the resource it's attached to."],
 mnemonic:"STANDARD = STatic, Armored (closed by default), Zone-aware.",
 lab:"Create a Standard public IP and attach it to a VM's NIC with no NSG. Try to browse to it (fails). Add an NSG allowing port 80 and try again.",
 ref:LEARN+"virtual-network/ip-services/public-ip-addresses"};

LESSONS.udr={id:"udr",title:"User-defined routes",mins:3,
 keywords:["udr","user defined route","route table","next hop","virtual appliance","nva","ip forwarding","system routes","forced tunneling","0.0.0.0/0"],
 scenes:[
  {say:"Every subnet gets system routes automatically: traffic inside the VNet, to peered VNets, and out to the internet.",
   ops:[B("v","vnet",20,30,"vnet-prod","10.0.0.0/16",560,480),B("sw","subnet",45,80,"snet-web","10.0.1.0/24",245,170),B("sa","subnet",310,80,"snet-app","10.0.2.0/24",245,170),B("sf","subnet",45,290,"snet-firewall","10.0.3.0/24",510,190),
        B("w","vm",90,150,"vm-web","10.0.1.4"),B("a","vm",355,150,"vm-app","10.0.2.4"),B("fw","nva",225,370,"nva-fw","10.0.3.4"),
        T("sys",600,40,[["Prefix","Next hop"],["10.0.0.0/16","Virtual network"],["0.0.0.0/0","Internet"],["Private ranges outside VNet","None"]],"System routes"),P(["w","a"],"","ok")]},
  {say:"To force traffic through a firewall appliance, create a route table with a user-defined route.",
   ops:[T("rt",600,210,[["Prefix","Next hop type","Next hop IP"],["10.0.2.0/24","Virtual appliance","10.0.3.4"]],"rt-web (route table)")]},
  {say:"Associate the route table with the source subnet, here snet-web. Now traffic to the app subnet detours through the appliance.",
   ops:[H("sw"),L("lr","sw","sf","rt-web","dash"),P(["w","fw","a"],"","ok")]},
  {say:"Two gotchas. Enable IP forwarding on the appliance's network interface, or Azure drops traffic that isn't addressed to it. The operating system must forward packets too.",
   ops:[N("n1",600,330,"NIC of nva-fw → IP forwarding: Enabled\n+ forwarding turned on inside the OS","bad")]},
  {say:"Azure picks routes by longest prefix match. If two routes share the same prefix, a user-defined route beats BGP, and BGP beats a system route.",
   ops:[...D("n1"),T("pr",600,330,[["Tie on prefix?","Wins"],["User-defined route","1st"],["BGP route","2nd"],["System route","3rd"]],"Route selection")]},
  {say:"Next hop types to know: virtual appliance, virtual network gateway, virtual network, internet, and none, which simply drops the traffic.",
   ops:[...D("pr","sys","rt","lr"),T("nh",600,40,[["Next hop type","Meaning"],["Virtual appliance","Send to an NVA IP"],["Virtual network gateway","Send to VPN gateway"],["Virtual network","Route inside the VNet"],["Internet","Send to the internet"],["None","Drop the packet"]],"Next hop types")]},
  {say:"Watch the return path. If only snet-web uses the appliance, replies from the app go straight back, and stateful firewalls drop that asymmetric traffic. Add a route table to snet-app too.",
   ops:[P(["a","w"],"reply","bad"),N("n2",600,330,"Asymmetric routing! Add rt-app on snet-app:\n10.0.1.0/24 → Virtual appliance 10.0.3.4","bad")]},
  {say:"One route table can be associated with many subnets, but each subnet has at most one route table, in the same region and subscription.",
   ops:[...D("n2"),N("n3",600,330,"Route table → many subnets\nSubnet → zero or one route table","accent")]}
 ],
 takeaways:["Route tables hold UDRs and are associated with subnets, not VMs or NICs.","Next hop \"Virtual appliance\" needs a next hop IP, and the NVA's NIC needs IP forwarding enabled.","Longest prefix wins. On a tie: UDR > BGP > system route.","0.0.0.0/0 → Virtual appliance or Virtual network gateway = forced tunneling of internet traffic.","Fix asymmetric routing with route tables on both subnets."],
 traps:["Next hop type \"None\" drops traffic. Use it to block a route.","UDRs don't change traffic between VMs in the same subnet unless the route table is on that subnet and the prefix matches."],
 mnemonic:"Routes are like postcodes: the most specific address wins, and the user's handwriting beats the printed label.",
 lab:"Create a route table with 0.0.0.0/0 → None and associate it with a test subnet. From a VM there, try to reach the internet. Then use Network Watcher Next hop to see why it fails.",
 ref:LEARN+"virtual-network/virtual-networks-udr-overview"};

LESSONS.nsg={id:"nsg",title:"Network security groups",mins:3,
 keywords:["nsg","network security group","security rule","priority","default rules","service tag","stateful","inbound","outbound","65500"],
 scenes:[
  {say:"A network security group, or NSG, is a list of allow and deny rules for traffic going in and out of a subnet or a network interface.",
   ops:[B("inet","internet",30,230,"Internet"),B("v","vnet",210,40,"vnet-prod","10.0.0.0/16",370,460),B("sn","subnet",235,110,"snet-web","10.0.1.0/24",320,360),
        B("ns","nsg",320,160,"nsg-snet","on subnet"),B("vm","vm",320,290,"vm-web1","10.0.1.4")]},
  {say:"Each rule has a priority from one hundred to four thousand ninety-six. Lower numbers are checked first, and processing stops at the first match.",
   ops:[T("r",600,40,[["Pri","Name","Port","Source","Action"],["100","Allow-HTTPS","443","Internet","Allow"],["200","Deny-Web","Any","Internet","Deny"]],"Inbound rules")]},
  {say:"A request on port four forty-three matches priority one hundred and is allowed. Port twenty-two skips it, matches two hundred, and is denied.",
   ops:[R("r",1,"ok"),P(["inet","ns","vm"],"443","ok"),R("r",2,"bad"),P(["inet","ns","vm"],"22","bad",true)]},
  {say:"Every NSG also has default rules from sixty-five thousand up: allow traffic within the VNet, allow the Azure load balancer, and deny everything else inbound.",
   ops:[R("r",0),T("d",600,200,[["Pri","Default inbound rule","Action"],["65000","AllowVnetInBound","Allow"],["65001","AllowAzureLoadBalancerInBound","Allow"],["65500","DenyAllInBound","Deny"]],"Defaults (can't delete)")]},
  {say:"Outbound defaults allow the VNet and the internet, then deny the rest. You can't delete default rules, but higher-priority rules override them.",
   ops:[T("d2",600,340,[["Pri","Default outbound rule","Action"],["65000","AllowVnetOutBound","Allow"],["65001","AllowInternetOutBound","Allow"],["65500","DenyAllOutBound","Deny"]])]},
  {say:"NSGs can attach to a subnet and to a NIC. Inbound, the subnet NSG is checked first, then the NIC's. Outbound, it's the reverse. Both must allow the traffic.",
   ops:[...D("d","d2"),B("nn","nsg",320,385,"nsg-nic","on NIC"),N("n1",600,220,"Inbound:  subnet NSG → NIC NSG\nOutbound: NIC NSG → subnet NSG\nA deny in either one blocks it","accent"),P(["inet","ns","nn","vm"],"443","ok")]},
  {say:"NSGs are stateful. If inbound port four forty-three is allowed, the reply goes back out automatically. No outbound rule is needed.",
   ops:[P(["vm","inet"],"reply","ok")]},
  {say:"Use service tags like Internet, VirtualNetwork, AzureLoadBalancer or Storage instead of IP ranges. Microsoft keeps them up to date for you.",
   ops:[...D("n1"),N("n2",600,220,"Service tags: Internet · VirtualNetwork\nAzureLoadBalancer · Storage · Sql · AzureCloud","ok")]}
 ],
 takeaways:["Priority 100–4096; lowest number wins; first match stops processing.","Default rules (65000, 65001, 65500) can't be deleted, only overridden.","Inbound: subnet NSG then NIC NSG. Outbound: NIC then subnet. Both must allow.","NSGs are stateful: allowed flows get their return traffic automatically.","An NSG must be in the same region as the subnet or NIC it's associated with."],
 traps:["A rule at priority 4096 can never beat a rule at 100. Read the numbers, not the order they're listed in.","\"VMs in the same VNet can't communicate\" → look for a custom deny rule above AllowVnetInBound (65000)."],
 mnemonic:"Inbound you walk through the building's front door (subnet) before your office door (NIC).",
 lab:"Create an NSG with Deny port 80 at priority 200 and Allow port 80 at priority 300, associate it with a subnet, and test. Swap the priorities and test again.",
 ref:LEARN+"virtual-network/network-security-groups-overview"};

LESSONS.asg={id:"asg",title:"ASGs & effective security rules",mins:2,
 keywords:["asg","application security group","effective security rules","ip flow verify","nsg troubleshooting","web tier","app tier"],
 scenes:[
  {say:"Application security groups let you group VMs by role, and write NSG rules using those group names instead of IP addresses.",
   ops:[B("v","vnet",20,30,"vnet-prod","10.0.0.0/16",560,480),B("sn","subnet",45,80,"snet-workload","10.0.1.0/24",510,410),
        B("gw","group",65,140,"asg-web","",190,190),B("ga","group",335,140,"asg-app","",190,190),B("gd","group",200,345,"asg-db","",190,115),
        B("w1","vm",85,170,"web1"),B("w2","vm",85,250,"web2"),B("a1","vm",355,170,"app1"),B("a2","vm",355,250,"app2"),B("d1","sql",220,385,"db1")]},
  {say:"Now the rules read like a description of your application: internet to web, web to app, app to database, and deny everything else.",
   ops:[T("r",600,50,[["Pri","Source","Destination","Port","Action"],["100","Internet","asg-web","443","Allow"],["110","asg-web","asg-app","8080","Allow"],["120","asg-app","asg-db","1433","Allow"],["4000","VirtualNetwork","VirtualNetwork","Any","Deny"]],"nsg-workload")]},
  {say:"Web one to app one on port eighty eighty matches rule one ten. Allowed. Web one straight to the database matches nothing until rule four thousand. Denied.",
   ops:[R("r",2,"ok"),P(["w1","a1"],"8080","ok"),R("r",4,"bad"),P(["w1","d1"],"1433","bad",true)]},
  {say:"Add a new web server's network interface to asg-web, and it picks up every rule instantly. No rule edits, no IP lists to maintain.",
   ops:[R("r",0),N("n1",600,250,"New VM? Put its NIC in asg-web.\nRules apply automatically.","ok")]},
  {say:"The limits: all network interfaces in an ASG must be in the same VNet, and an ASG can be a source or destination in NSG rules.",
   ops:[...D("n1"),N("n2",600,250,"All NICs in an ASG → same VNet\nASG = source or destination in a rule","accent")]},
  {say:"When traffic is mysteriously blocked, open Effective security rules on the VM's network interface. It shows the merged result of the subnet and NIC NSGs.",
   ops:[C(),B("vm","vm",90,240,"vm-web1","running"),B("ew","watcher",420,60,"Network Watcher"),
        T("ef",420,200,[["Source","Effective rule","Result"],["Subnet NSG","Allow-HTTPS (100)","Allow"],["NIC NSG","Deny-All-Web (150)","Deny"],["Combined","Port 443 inbound","Deny"]],"Effective security rules · NIC of vm-web1")]},
  {say:"Or use IP flow verify in Network Watcher. Give it the VM, direction, protocol, ports and IP addresses, and it tells you Allow or Deny, plus the rule that decided.",
   ops:[L("lw","ew","vm","IP flow verify","dash"),P(["ew","vm"],"TCP 443","bad",true),N("n3",420,380,"Result: Access denied\nRule: nsg-nic / Deny-All-Web","bad")]}
 ],
 takeaways:["ASGs group NICs by role; NSG rules reference the ASG instead of IPs.","All NICs in an ASG must be in the same VNet as the ASG's first member.","Effective security rules (on the NIC) show the combined result of subnet and NIC NSGs. The VM must be running.","IP flow verify answers \"allowed or denied, and by which rule?\" for one 5-tuple."],
 traps:["ASGs are not a security boundary on their own. They do nothing until an NSG rule references them.","You can't use an ASG to group NICs from different VNets."],
 mnemonic:"ASG = A Squad Group: name the squad, write the rule once.",
 lab:"Create asg-web and asg-app, put one VM in each, and write an NSG rule allowing asg-web → asg-app on port 22 only. Verify with IP flow verify.",
 ref:LEARN+"virtual-network/application-security-groups"};

LESSONS.bastion={id:"bastion",title:"Azure Bastion",mins:2,
 keywords:["bastion","rdp","ssh","jump box","azurebastionsubnet","native client","bastion sku","developer sku","/26"],
 scenes:[

   ops:[B("inet","internet",40,230,"Internet","bots scanning"),B("v","vnet",320,40,"vnet-prod","10.0.0.0/16",600,460),B("vm","vm",620,230,"vm-app1","public IP"),
        P(["inet","vm"],"3389","bad"),P(["inet","vm"],"22","bad")]},
  {say:"Azure Bastion fixes this. It's a managed service in your VNet that brokers RDP and SSH over TLS on port four forty-three, straight from the Azure portal.",
   ops:[C(),B("u","user",40,135,"Admin","browser"),B("v","vnet",280,40,"vnet-prod","10.0.0.0/16",640,460),B("bs","subnet",310,90,"AzureBastionSubnet","10.0.0.0/26",280,150),
        B("b","bastion",375,150,"bas-prod"),B("sa","subnet",310,290,"snet-app","10.0.1.0/24",580,180),B("v1","vm",360,355,"vm-app1","10.0.1.4"),B("v2","vm",620,355,"vm-app2","10.0.1.5"),
        L("l1","u","b","HTTPS 443",""),P(["u","b","v1"],"RDP","ok")]},
  {say:"The VMs need no public IP at all. Bastion reaches them on their private IP addresses.",
   ops:[N("n1",620,120,"VMs: no public IP\nNo RDP/SSH open to the internet","ok"),P(["u","b","v2"],"SSH","ok")]},
  {say:"Requirements: a dedicated subnet named exactly AzureBastionSubnet, sized slash twenty-six or larger, and a Standard public IP for the bastion.",
   ops:[...D("n1"),H("bs"),N("n2",620,110,"Name: AzureBastionSubnet\nSize: /26 or larger\nStandard public IP","accent")]},
  {say:"SKUs. Developer is free and shared, for dev and test. Basic covers portal connections. Standard adds native client support and host scaling. Premium adds session recording.",
   ops:[C(),T("sk",150,130,[["SKU","Adds"],["Developer","Free, shared, dev/test, one VM at a time"],["Basic","Dedicated, portal RDP/SSH"],["Standard","Native client, host scaling, IP-based, shareable link"],["Premium","Session recording, private-only deployment"]],"Bastion SKUs")]},
  {say:"Exam tip: if the question needs your local RDP or SSH client, the native client, you need Standard or Premium.",
   ops:[R("sk",3,"accent")]},
  {say:"Bastion also reaches VMs in peered VNets, so one bastion in the hub can serve every spoke.",
   ops:[...D("sk"),B("hub","vnet",300,60,"vnet-hub","AzureBastionSubnet",360,150),B("b","bastion",405,115,"bas-hub"),B("s1","vnet",40,330,"vnet-spoke1","",320,160),B("s2","vnet",600,330,"vnet-spoke2","",320,160),B("x1","vm",125,395,"vm-a"),B("x2","vm",685,395,"vm-b"),L("q1","hub","s1","peering","peer"),L("q2","hub","s2","peering","peer"),P(["b","x1"],"RDP","ok"),P(["b","x2"],"SSH","ok")]}
 ],

 traps:["\"AzureBastion\" or \"BastionSubnet\" are wrong names. It's exactly AzureBastionSubnet.","Upgrading SKU (Basic → Standard) is supported. Downgrading isn't."],
 mnemonic:"Bastion needs a /26 castle: name it exactly, guard it at 443.",

LESSONS.endpoints={id:"endpoints",title:"Service vs private endpoints",mins:3,
 keywords:["service endpoint","private endpoint","private link","privatelink","storage firewall","paas","microsoft.storage","exfiltration","private dns"],
 scenes:[
  {say:"Storage accounts and SQL databases have public endpoints. By default, a VM reaches them using a public IP address.",
   ops:[B("v","vnet",20,40,"vnet-app","10.0.0.0/16",430,460),B("sa","subnet",45,95,"snet-app","10.0.1.0/24",380,190),B("vm","vm",160,165,"vm-app","10.0.1.4"),
        B("st","storage",660,165,"stcontoso","public endpoint"),P(["vm","st"],"public IP","signal")]},
  {say:"A service endpoint, turned on for the subnet for Microsoft dot Storage, sends that traffic on an optimal Azure backbone route and identifies it by VNet and subnet.",
   ops:[SET("sa","snet-app","Service endpoint: Microsoft.Storage"),L("l1","vm","st","service endpoint","dash"),P(["vm","st"],"","ok")]},
  {say:"Then you lock the storage firewall to allow only that subnet. But the storage account still has a public endpoint with a public IP.",
   ops:[T("fw",560,250,[["Storage firewall","Setting"],["Public access","Selected networks"],["Allowed","vnet-app / snet-app"]])]},
  {say:"A private endpoint goes further. It places a network interface with a private IP from your subnet, mapped to one specific resource.",
   ops:[...D("fw","l1"),B("sp","subnet",45,310,"snet-pe","10.0.2.0/24",380,160),B("pe","pe",160,365,"pe-stcontoso","10.0.2.5"),L("l2","pe","st","Private Link","ok"),P(["vm","pe","st"],"10.0.2.5","ok")]},
  {say:"DNS makes it work. A private DNS zone, privatelink dot blob dot core dot windows dot net, resolves the storage name to the private IP instead of the public one.",
   ops:[B("dz","dns",600,380,"Private DNS zone","privatelink.blob…",190),T("dn",520,40,[["Name","Resolves to"],["stcontoso.blob.core.windows.net","CNAME → privatelink"],["stcontoso.privatelink.blob…","A 10.0.2.5"]],"From inside vnet-app")]},
  {say:"Private endpoints are reachable from peered VNets and from on-premises over VPN or ExpressRoute. Service endpoints don't help on-premises traffic.",
   ops:[...D("dn"),N("n1",500,60,"Private endpoint: peered VNets + on-premises ✓\nService endpoint: on-premises ✗","accent")]},
  {say:"Here's the side-by-side comparison.",
   ops:[C(),T("cmp",120,90,[["","Service endpoint","Private endpoint"],["Scope","Whole service (all accounts)","One specific resource"],["Address used","Public endpoint of the service","Private IP in your VNet"],["From on-premises","No","Yes"],["DNS changes","None","Private DNS zone"],["Cost","Free","Hourly + data processed"],["Data exfiltration protection","Partial (endpoint policies)","Yes"]],"Service endpoint vs private endpoint")]},
  {say:"Exam tip: phrases like without a public endpoint, or access from on-premises, point to a private endpoint. Simple, free, restrict to a subnet points to a service endpoint.",
   ops:[R("cmp",3,"accent")]}
 ],
 takeaways:["Service endpoint: per subnet, per service; free; PaaS keeps its public endpoint; lock the resource firewall to the subnet.","Private endpoint: NIC with a private IP in your subnet for one resource (and sub-resource such as blob or file).","Private endpoints need DNS: privatelink.* private DNS zone linked to the VNet.","Only private endpoints work from on-premises and peered networks."],
 traps:["Creating a private endpoint doesn't disable public access by itself. Turn public network access off on the resource.","A storage account's blob and file services each need their own private endpoint (sub-resource)."],
 mnemonic:"Service endpoint = a VIP lane to a public door. Private endpoint = the door moved inside your house.",
 lab:"Create a storage account. Add a service endpoint on a subnet and allow only that subnet in the storage firewall. Then add a private endpoint and run nslookup from a VM to see the private IP.",
 ref:LEARN+"private-link/private-endpoint-overview"};

LESSONS.dns={id:"dns",title:"Azure DNS",mins:3,
 keywords:["dns","azure dns","dns zone","private dns zone","alias record","cname","a record","mx","delegation","name server","auto registration","168.63.129.16","virtual network link"],
 scenes:[
  {say:"Azure DNS hosts your DNS zones on Microsoft's global name servers. You manage records with the same tools as everything else in Azure.",
   ops:[B("z","dns",400,60,"contoso.com","Public DNS zone",170)]},
  {say:"You still buy the domain from a registrar. To make Azure answer for it, delegate: copy Azure's four name servers into the NS records at your registrar.",
   ops:[B("rg","app",40,60,"Registrar","contoso.com"),L("l1","rg","z","NS delegation","dash"),T("ns",620,40,[["NS records (example)"],["ns1-01.azure-dns.com"],["ns2-01.azure-dns.net"],["ns3-01.azure-dns.org"],["ns4-01.azure-dns.info"]])]},
  {say:"Record types to know: A for IPv4, quad-A for IPv6, CNAME for an alias name, MX for mail, TXT for verification, plus NS and SOA for the zone itself.",
   ops:[...D("ns"),T("rt",40,200,[["Type","Use","Example"],["A","Name → IPv4","www → 20.1.2.3"],["AAAA","Name → IPv6","www → 2001:db8::1"],["CNAME","Name → another name","shop → contoso.azurewebsites.net"],["MX","Mail servers","@ → mail.contoso.com"],["TXT","Verification, SPF","@ → \"v=spf1 …\""]],"Common record types")]},
  {say:"Alias records point directly at an Azure resource, like a public IP or Front Door. They update automatically when its IP changes, and they work at the zone apex, where CNAME isn't allowed.",
   ops:[B("ip","ip",640,230,"pip-web","Azure resource"),L("l2","z","ip","alias @","ok"),N("n1",560,340,"Apex (@) can't be a CNAME.\nUse an alias record instead.","accent")]},
  {say:"Private DNS zones resolve names only inside your VNets. Link the zone to each VNet that needs it with a virtual network link.",
   ops:[C(),B("pz","dns",385,40,"contoso.internal","Private DNS zone",190),B("va","vnet",40,220,"vnet-hub","10.0.0.0/16",400,270),B("vb","vnet",520,220,"vnet-spoke","10.1.0.0/16",400,270),
        L("k1","pz","va","link","dash"),L("k2","pz","vb","link","dash")]},
  {say:"Turn on auto-registration on a link, and VMs in that VNet get their A records created and removed automatically.",
   ops:[SET("k1","link + auto-registration"),B("vm","vm",160,330,"vm-web1","10.0.0.4"),T("rr",560,320,[["Record","Type","Value"],["vm-web1","A","10.0.0.4"]],"Auto-registered"),P(["vm","pz"],"register","ok")]},
  {say:"Limits to remember: a VNet can link to many private zones, but auto-registration can be on for only one private zone per VNet.",
   ops:[N("n2",300,140,"Per VNet: many zone links, ONE auto-registration zone","bad")]},
  {say:"Behind the scenes, Azure-provided DNS answers at one sixty-eight dot sixty-three dot one twenty-nine dot sixteen. If you set custom DNS servers on a VNet, restart the VMs so they pick up the change.",
   ops:[...D("n2"),N("n3",300,140,"Azure DNS: 168.63.129.16 · custom DNS → restart VMs","accent")]}
 ],
 takeaways:["Delegate a public zone by putting Azure's NS records at the registrar.","Alias records target Azure resources, auto-update, and are allowed at the apex.","Private DNS zones need a virtual network link per VNet. Auto-registration is per link.","One auto-registration private zone per VNet; many resolution-only links.","Custom DNS is set on the VNet (or NIC); VMs need a restart or DHCP renewal to pick it up."],
 traps:["You can't create a CNAME at the zone apex (contoso.com). Use an alias A record.","Public and private zones can have the same name (split-horizon). VNet clients get the private answers."],
 mnemonic:"Delegate up, link down: NS records go UP to the registrar, links go DOWN to VNets.",
 lab:"Create a private DNS zone, link it to a VNet with auto-registration on, and deploy a VM. Watch the A record appear, then nslookup the VM's name from another VM.",
 ref:LEARN+"dns/dns-overview"};

LESSONS.lb={id:"lb",title:"Azure Load Balancer",mins:3,
 keywords:["load balancer","lb","health probe","backend pool","frontend ip","internal load balancer","public load balancer","session persistence","inbound nat rule","outbound rule","ha ports","application gateway","front door","traffic manager"],
 scenes:[
  {say:"Azure Load Balancer spreads incoming traffic across healthy VMs at layer four, meaning TCP and UDP.",
   ops:[B("inet","internet",30,220,"Internet"),B("lb","lb",250,220,"lb-web","Public · Standard",175),B("v","vnet",500,40,"vnet-web","10.0.0.0/16",430,470),B("pool","group",540,95,"Backend pool","",350,385),
        B("v1","vm",640,130,"vm1","10.0.1.4"),B("v2","vm",640,240,"vm2","10.0.1.5"),B("v3","vm",640,350,"vm3","10.0.1.6"),L("l0","inet","lb")]},
  {say:"It has four parts: a frontend IP, a backend pool, health probes, and load-balancing rules that connect them.",
   ops:[T("p",180,320,[["Part","Example"],["Frontend IP","pip-lb (public)"],["Backend pool","vm1, vm2, vm3"],["Health probe","HTTP :80 /health"],["LB rule","TCP 80 → 80"]])]},
  {say:"New connections are spread across the pool.",
   ops:[P(["inet","lb","v1"],"","signal"),P(["inet","lb","v2"],"","signal"),P(["inet","lb","v3"],"","signal")]},
  {say:"Health probes check each VM. If one stops answering, it leaves the rotation until it recovers.",
   ops:[M("v3","bad"),SET("v3","vm3","probe failing"),P(["inet","lb","v1"],"","signal"),P(["inet","lb","v2"],"","signal")]},
  {say:"A public load balancer faces the internet. An internal load balancer uses a private frontend IP, for tiers like app or database.",
   ops:[...D("p"),N("n1",120,330,"Public LB: public frontend IP\nInternal LB: private frontend IP","accent")]},
  {say:"Traffic is spread by a five-tuple hash by default. Session persistence can pin a client by source IP, or by source IP and protocol.",
   ops:[...D("n1"),N("n2",120,330,"Default: 5-tuple hash\nPersistence: Client IP (2-tuple)\n or Client IP + protocol (3-tuple)","accent")]},
  {say:"Standard load balancers are secure by default, so backend VMs need an NSG that allows the traffic. Probes come from one sixty-eight dot sixty-three dot one twenty-nine dot sixteen, the AzureLoadBalancer tag. Never block it.",
   ops:[...D("n2"),M("v3"),SET("v3","vm3","10.0.1.6"),N("n3",60,330,"NSG must allow app traffic\n+ AzureLoadBalancer (168.63.129.16)","bad")]},
  {say:"Inbound NAT rules map one frontend port to one VM, for example port fifty thousand one to RDP on vm1. Outbound rules control SNAT for internet access.",
   ops:[...D("n3"),N("n4",60,330,"Inbound NAT: :50001 → vm1:3389\nOutbound rules: SNAT for egress","accent"),P(["inet","lb","v1"],"50001","signal")]},
  {say:"Load Balancer is layer four only. Need URL paths, TLS offload, or a web application firewall? That's Application Gateway. Global routing? Front Door or Traffic Manager.",
   ops:[C(),T("cmp",130,90,[["Service","Layer","Scope","Pick it when…"],["Load Balancer","4 (TCP/UDP)","Regional","Any TCP/UDP app, internal or public"],["Application Gateway","7 (HTTP)","Regional","Path routing, TLS offload, WAF"],["Front Door","7 (HTTP)","Global","Global web apps, CDN, WAF"],["Traffic Manager","DNS","Global","DNS-based routing between regions"]],"Which load balancer?")]}
 ],
 takeaways:["Components: frontend IP, backend pool, health probe, LB rule (+ inbound NAT rules, outbound rules).","Standard LB is secure by default: backends need an NSG allowing the traffic.","Health probes come from 168.63.129.16 (AzureLoadBalancer tag). Blocking it marks every VM unhealthy.","Session persistence: None (5-tuple), Client IP, Client IP and protocol.","L4 = Load Balancer. HTTP paths/WAF = Application Gateway. Global = Front Door / Traffic Manager."],
 traps:["Backend VMs of a Standard LB must be in the same VNet.","Basic Load Balancer was retired on 30 September 2025. Standard SKU is the answer in current scenarios.","A VM in an internal LB's backend pool can't reach that LB's own frontend (hairpin)."],
 mnemonic:"F-B-P-R: Front door, Bouncers' list, Pulse check, Rules → \"Friendly Bouncers Pulse-check Regulars.\"",
 lab:"Deploy two VMs running a web server, a Standard public LB, an HTTP health probe and a rule for port 80. Stop the web service on one VM and watch the probe mark it down.",
 ref:LEARN+"load-balancer/load-balancer-overview"};

LESSONS.nw={id:"nw",title:"Network Watcher troubleshooting",mins:2,
 keywords:["network watcher","ip flow verify","next hop","connection troubleshoot","connection monitor","packet capture","flow logs","vnet flow logs","nsg flow logs","traffic analytics","troubleshoot connectivity"],
 scenes:[
  {say:"Network Watcher is Azure's toolbox for diagnosing network problems. It's enabled automatically in every region where you have a virtual network.",
   ops:[B("w","watcher",395,40,"Network Watcher","per region",170)]},
  {say:"Each tool answers one question. Learn to match the question to the tool.",
   ops:[T("t",110,140,[["Tool","Answers"],["IP flow verify","Is this packet allowed or denied, and by which rule?"],["NSG diagnostics","Same, with full detail across subnet and NIC NSGs"],["Next hop","Where does traffic go next, and from which route?"],["Connection troubleshoot","Can A reach B right now? Where does it fail?"],["Connection monitor","Reachability and latency over time"],["Packet capture","Record traffic on a VM (needs agent extension)"],["Flow logs","Log IP flows for analysis"]],"Network Watcher tools")]},
  {say:"Scenario: vm-web can't reach vm-db on port fourteen thirty-three. Start with connection troubleshoot.",
   ops:[C(),B("w","watcher",395,40,"Network Watcher","",170),B("a","vm",120,250,"vm-web","10.0.1.4"),B("b","sql",690,250,"vm-db","10.0.2.4"),
        L("l1","w","a","connection troubleshoot","dash"),P(["a","b"],"1433","bad",true),N("n1",270,380,"Result: Unreachable\nHop 1 blocked by NSG rule Deny-SQL (nsg-db)","bad")]},
  {say:"Next hop finds routing problems, like a user-defined route sending traffic to an appliance that's down, or to None.",
   ops:[...D("n1"),N("n2",270,380,"Next hop from vm-web to 10.0.2.4:\nVirtual appliance 10.0.3.4 (route table rt-web)","accent")]},
  {say:"NSG flow logs are being retired, and new ones can't be created since mid twenty twenty-five. Use virtual network flow logs, stored in a storage account and analyzed with Traffic analytics.",
   ops:[...D("n2"),B("st","storage",395,390,"Storage account","VNet flow logs",170),L("l2","w","st","flow logs","dash"),N("n3",600,380,"NSG flow logs → retiring\nUse VNet flow logs\n+ Traffic analytics","accent")]},
  {say:"Exam tip: match the verb to the tool. Allowed or denied, IP flow verify. Which route, next hop. Capture packets, packet capture. Over time, connection monitor.",
   ops:[...D("n3"),N("n4",560,120,"allowed/denied → IP flow verify\nwhich route → Next hop\ncapture → Packet capture\nover time → Connection monitor","ok")]}
 ],
 takeaways:["IP flow verify: allow/deny plus the deciding NSG rule for one flow.","Next hop: next hop type, IP and the route table responsible.","Connection troubleshoot: one-time end-to-end check; Connection monitor: continuous.","Packet capture needs the Network Watcher agent VM extension.","NSG flow logs are being retired; VNet flow logs + Traffic analytics replace them."],
 traps:["Effective routes (on the NIC) and Next hop both show routing. Next hop answers for a specific destination IP.","Network Watcher is regional. It lives in the NetworkWatcherRG resource group by default."],
 mnemonic:"Verb → tool: Allowed? Flow. Where? Hop. Record? Capture. Trend? Monitor.",
 lab:"On a VM in a subnet with a deny rule, run IP flow verify for inbound TCP 3389, then Next hop to 8.8.8.8. Note the rule and route each one names.",
 ref:LEARN+"network-watcher/network-watcher-overview"};

const CASES={
 fabrikam:{title:"Fabrikam Logistics",text:"Fabrikam has one Azure subscription in East US.\n\n• vnet-hub (10.0.0.0/16) contains a VPN gateway connected to the head office, and a firewall appliance (nva-fw, 10.0.3.4) in snet-firewall.\n• vnet-spoke1 (10.1.0.0/16) hosts the web tier; vnet-spoke2 (10.2.0.0/16) hosts the order database on VMs.\n• Both spokes are peered with the hub. The spokes are not peered with each other.\n• A storage account, stfabdocs, stores shipping documents.\n\nRequirements:\n1. Web VMs in spoke1 must reach the database in spoke2 through nva-fw.\n2. Head-office users must reach stfabdocs over the VPN without using a public endpoint.\n3. Administrators must manage VMs over RDP without any VM having a public IP, using their local RDP client.\n4. Spoke VMs must use the hub's VPN gateway to reach the head office."}
};

/* --- vnet --- */
{id:"vn1",l:"vnet",t:"mc",s:"You create a subnet with the address range 10.20.4.0/27. How many IP addresses are available for VMs?",o:["32","30","27","25"],a:2,
 e:"A /27 has 32 addresses. Azure reserves 5 in every subnet (network, gateway, two DNS, broadcast), leaving 27.",
 w:["32 is the raw block size before Azure's 5 reserved addresses.","30 subtracts only the network and broadcast addresses, as on-premises networking would.","","25 subtracts too many. Azure reserves exactly 5."]},
{id:"vn2",l:"vnet",t:"mc",s:"What is the smallest IPv4 subnet size you can create in an Azure virtual network?",o:["/30","/29","/28","/24"],a:1,
 e:"The smallest supported IPv4 subnet is /29 (8 addresses, 3 usable after the 5 reserved).",
 w:["A /30 has 4 addresses, fewer than Azure's 5 reserved ones.","","/28 works but isn't the smallest.","/24 is common but far from the smallest."]},
{id:"vn3",l:"vnet",t:"mc",s:"A VM in a new subnet 10.0.5.0/24 receives the first dynamically assigned private IP. Which address does it get?",o:["10.0.5.0","10.0.5.1","10.0.5.4","10.0.5.10"],a:2,
 e:"x.x.x.0 to x.x.x.3 are reserved, so the first usable address is .4.",

{id:"vn4",l:"vnet",t:"ms",pick:2,s:"VNet1 (10.1.0.0/16) is almost full. You need room for a new subnet 10.2.0.0/24 in VNet1. Which two statements are true? Each correct answer presents a complete solution or fact.",
 o:["You can add 10.2.0.0/16 as an additional address space to VNet1.","You must delete and recreate VNet1 with a larger range.","After adding the address space, you can create 10.2.0.0/24 as a subnet.","Subnets can extend beyond the VNet's address space."],a:[0,2],
 e:"A VNet can have multiple address spaces. Add 10.2.0.0/16, then create the subnet inside it.",
